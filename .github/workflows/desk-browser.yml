name: Desk browser tests
# Robot click-tests for the Localization Desk (monorepo runbook WO-04, guard G9): a real
# Chromium drives the desk in the click-test harness — sign-in simulated, the dispatch
# Worker mocked in its three modes. The CEL pre-commit hook runs the same file before a
# commit; this job is the backstop after a push. Keyless: no secrets, nothing leaves the
# runner.

on:
  push:
    branches: [main]
    paths:
      - "tools/localize_desk/**"
      - "docs/admin/localization/**"
      - "data/localize/**"
      - "tools/dashboard.py"
      - ".github/workflows/desk-browser.yml"
  pull_request:
    paths:
      - "tools/localize_desk/**"
      - "docs/admin/localization/**"
      - "data/localize/**"
      - "tools/dashboard.py"
      - ".github/workflows/desk-browser.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: desk-browser-${{ github.ref }}
  # Only a pull request's superseded run is cancelled. On main a newer push queues behind
  # the running one: the notice below fires on cancelled() (that is how a timeout reads),
  # so a push that cancelled its predecessor would open a false "failed" issue.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Playwright and Chromium
        run: |
          set -o pipefail
          python3 -m pip install --upgrade pip
          # Pinned to what the pre-commit hook runs (the monorepo's .venv314), so a new
          # Playwright release cannot turn this red -- or green -- on its own.
          pip install pytest==9.0.2 playwright==1.58.0
          python3 -m playwright install --with-deps chromium

      - name: Desk browser tests
        # The timing budgets are set on the operator's Mac; this runner is about 2.4x slower
        # under the same 4x CPU throttle (first run: 0.305 s vs 0.126 s median switch).
        env:
          DESK_BUDGET_SCALE: "2.5"
        run: cd tools && python3 -m pytest localize_desk/tests/browser -p no:cacheprovider -rxs

      - name: Notify on failure
        # `cancelled()`: a timeout marks the job cancelled, not failed. A pull request's
        # superseded run is cancelled too, and is no failure.
        if: failure() || (cancelled() && github.event_name != 'pull_request')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh label create ci-failure --repo "${{ github.repository }}" \
            --color B60205 --description "Automated CI/cron failure alerts" --force >/dev/null 2>&1 || true
          TITLE="🔴 ${{ github.workflow }} failed"
          URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          NUM=$(gh issue list --repo "${{ github.repository }}" --label ci-failure --state open \
                  --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --repo "${{ github.repository }}" \
              --body "Failed again at $(date -u +%FT%TZ). Run: $URL"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" \
              --label ci-failure \
              --body "Desk browser tests failed. Run: $URL. Auto-updates on repeat failures; close once resolved."
          fi
