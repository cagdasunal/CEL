name: Desk live check
# After GitHub Pages deploys a push, the desk it serves must be the desk that was pushed
# (monorepo runbook WO-33, review round 2). Nothing checked this: a failed Pages build, a
# stale CDN copy or a file left out of the commit left reviewers on yesterday's desk while
# every test was green. Fetches each desk page, its data and its two stylesheets with the
# commit id as a cache-busting query and compares the bytes with the checkout
# (tools/localize_desk/live_check.py). Keyless: it only reads the public site.

on:
  deployment_status: {}
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  live:
    # A Pages deployment that finished -- succeeded, failed or errored -- or a manual run.
    # A failed deploy leaves the old desk served: the byte comparison then goes red if the
    # push changed the desk (a 'success'-only filter skipped it, and a skip reads as green).
    # Each deployment also emits waiting/queued/in_progress statuses; those runs are skipped.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment.environment == 'github-pages' &&
       contains(fromJSON('["success","failure","error"]'), github.event.deployment_status.state))
    # Job-level, so only runs that pass `if` queue here. At workflow level every status run
    # joined the group before `if` was read, so the next deploy's waiting/queued status could
    # cancel a pending check silently (run 36454954216: a status run cancelled by the next
    # one). No cancel-in-progress: a running check finishes; a newer check waits, replacing
    # any older pending one that never started.
    concurrency:
      group: desk-live-check
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # live_check retries 24 x 30 s (longer than the CDN's max-age=600) before a mismatch counts.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: The served desk is the pushed desk
        env:
          PUSHED_SHA: ${{ github.event.deployment.sha || github.sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: cd tools && python3 -m localize_desk.live_check --sha "$PUSHED_SHA" --repo "$REPO_URL"

      - name: Notify on failure
        # `failure() || cancelled()`: a timeout marks the job cancelled, not failed.
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh label create ci-failure --repo "${{ github.repository }}" \
            --color B60205 --description "Automated CI/cron failure alerts" --force >/dev/null 2>&1 || true
          TITLE="🔴 ${{ github.workflow }} failed"
          URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          NUM=$(gh issue list --repo "${{ github.repository }}" --label ci-failure --state open \
                  --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --repo "${{ github.repository }}" \
              --body "Failed again at $(date -u +%FT%TZ). Run: $URL"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" \
              --label ci-failure \
              --body "The desk GitHub Pages serves differs from the pushed commit. Run: $URL. Auto-updates on repeat failures; close once resolved."
          fi
