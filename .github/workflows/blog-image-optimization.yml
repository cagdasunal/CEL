name: Blog Image Optimization

on:
  schedule:
    # 11:00 UTC = 03:00 PST / 04:00 PDT — both deep night in San Diego.
    # Picked off the 00:00 UTC peak documented in GitHub Actions community
    # threads (cron jitter is worst at midnight UTC). Locked plan §6.
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      posts:
        description: "Comma-separated post slugs to optimize (default: ALL)"
        required: false
        type: string
        default: ""
      # ── AI-provenance scrub ────────────────────────────────────────────────
      # The nightly cron only ever SCANS (read-only). Replacing bytes on the
      # live site is an outward write on client assets, so it is manual-only and
      # needs BOTH inputs below — the checkbox alone is not enough. That is the
      # operator's standing instruction: replace happens on request, never on a
      # schedule.
      scrub_provenance:
        description: "Also STRIP provenance metadata and re-upload (manual only)"
        required: false
        type: boolean
        default: false
      scrub_confirm:
        description: "Type REPLACE to confirm the scrub. Anything else aborts."
        required: false
        type: string
        default: ""
      scrub_allow_new_asset_id:
        description: "Proceed even if a re-upload changes the asset id (breaks Designer refs)"
        required: false
        type: boolean
        default: false
  # Triggered by a Webflow `collection_item_publish` webhook → forwarded
  # via a Cloudflare Worker (or any HMAC-validating relay) to GitHub's
  # /repos/{owner}/{repo}/dispatches endpoint with event_type
  # `webflow_blog_published` and a JSON payload `{"slug": "<post-slug>"}`.
  # See docs/blog-image-optimization-setup.md for the receiver setup.
  repository_dispatch:
    types: [webflow_blog_published]

permissions:
  contents: write
  issues: write

concurrency:
  group: blog-image-optimization
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    # First whole-CMS sweep (--collections all) downloads + encodes every
    # not-yet-AVIF image across ~19 collections, so bump from 60 → 120. Steady
    # state is fast: subsequent nights HEAD-check and skip already-AVIF assets.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install image-processing deps
        run: |
          python -m pip install --upgrade pip
          # Versions match scripts/optimize_blog_richtext_images.py local test bed
          # (Pillow 12.2.0 + pillow-avif-plugin 1.5.5). Forward-compatible within
          # major versions — adjust if upstream breaks.
          pip install "Pillow>=12,<13" "pillow-avif-plugin>=1.5.5"

      - name: Resolve scope (collections + --posts filter)
        id: filter
        # env indirection, NOT `${{ }}` inside the script (audit 151 B-149).
        # `${{ }}` substitutes TEXTUALLY before bash parses the line, so a
        # webhook-supplied slug containing `$(...)`, a backtick or a newline used
        # to execute as code here — with contents:write and WEBFLOW_API_TOKEN in
        # scope. As env vars they are inert data, and the allowlist below rejects
        # anything that is not a Webflow slug shape.
        env:
          POSTS_INPUT: ${{ github.event.inputs.posts }}
          DISPATCH_SLUG: ${{ github.event.client_payload.slug }}
        run: |
          # workflow_dispatch.inputs.posts (manual) — optional comma list
          # repository_dispatch.client_payload.slug (webhook) — single slug
          #
          # Scope rule:
          #   • A targeted run (manual posts list OR single-post webhook) stays
          #     blog-only — --collections blog honors --posts and only touches
          #     the just-published post.
          #   • The untargeted nightly run sweeps the WHOLE CMS
          #     (--collections all) so every collection's images (Courses,
          #     Testimonials, Team, Activities, …) get AVIF-optimized and the
          #     /admin/#images dashboard reflects all of them.
          set -euo pipefail
          # A Webflow slug is lowercase alnum + hyphen by construction; the manual
          # input is a comma-separated list of them. Anything else is refused
          # rather than passed downstream.
          case "${POSTS_INPUT:-}" in
            *[!a-z0-9,-]*) echo "::error::rejected posts input — expected lowercase slugs separated by commas"; exit 1 ;;
          esac
          case "${DISPATCH_SLUG:-}" in
            *[!a-z0-9-]*) echo "::error::rejected dispatch slug — expected a lowercase Webflow slug"; exit 1 ;;
          esac
          # The values are emitted BARE (not as pre-built `--posts X` argument
          # strings): the consumer step quotes them, so a value can never split
          # into extra command-line words.
          if [ -n "${POSTS_INPUT:-}" ]; then
            echo "posts=$POSTS_INPUT" >> "$GITHUB_OUTPUT"
            echo "collections=blog" >> "$GITHUB_OUTPUT"
            echo "Filter: manual posts=$POSTS_INPUT (blog only)"
          elif [ -n "${DISPATCH_SLUG:-}" ]; then
            echo "posts=$DISPATCH_SLUG" >> "$GITHUB_OUTPUT"
            echo "collections=blog" >> "$GITHUB_OUTPUT"
            echo "Filter: webhook slug=$DISPATCH_SLUG (blog only)"
          else
            echo "posts=" >> "$GITHUB_OUTPUT"
            echo "collections=all" >> "$GITHUB_OUTPUT"
            echo "Filter: WHOLE CMS sweep (--collections all)"
          fi

      - name: Run CMS-image optimizer (--apply --auto-publish)
        env:
          WEBFLOW_API_TOKEN: ${{ secrets.WEBFLOW_API_TOKEN }}
          # Same env-indirection rule as the resolve step: these are derived from
          # user/webhook input, so they never touch the command line as `${{ }}`.
          COLLECTIONS: ${{ steps.filter.outputs.collections }}
          POSTS: ${{ steps.filter.outputs.posts }}
        run: |
          mkdir -p data/blog-richtext-backup
          touch data/blog-optimization-log.jsonl
          # --auto-publish is the DEFAULT but stated explicitly for clarity.
          # The optimizer enforces the safeguard internally:
          #   only items with lastPublished != null AND isDraft=False
          #   AND isArchived=False are published. Drafts are NEVER published.
          # COLLECTIONS = "all" on the nightly run (whole-CMS sweep), "blog" on
          # targeted manual/webhook runs. POSTS is empty on the nightly run, so
          # --posts is added only when there is a value — via an array, so the
          # value stays ONE argument even if it ever contains a space.
          POSTS_ARGS=()
          if [ -n "${POSTS:-}" ]; then
            POSTS_ARGS=(--posts "$POSTS")
          fi
          python scripts/optimize_blog_richtext_images.py \
            --site cel \
            --apply \
            --auto-publish \
            --collections "$COLLECTIONS" \
            "${POSTS_ARGS[@]}" \
            --log-jsonl data/blog-optimization-log.jsonl \
            --backup-dir data/blog-richtext-backup

      # ── AI-provenance scan (READ-ONLY — runs on every trigger) ─────────────
      # The optimizer above destroys C2PA as a side effect of re-encoding to
      # AVIF, but only for images it actually re-encodes. It skips already-AVIF
      # files under 200 KB and anything saving less than 30%, and it never sees
      # site Assets that no CMS item references. Those are exactly the images
      # that keep a signed manifest, so they need their own pass.
      #
      # This step never writes to Webflow. It downloads each asset, reports what
      # a crawler would read, and records the result. `--skip-known-clean` means
      # a nightly run only re-fetches assets not already proven clean, so the
      # steady-state cost is a handful of requests rather than 1,500.
      - name: Scan Webflow assets for AI-provenance metadata
        id: provenance_scan
        if: always()
        continue-on-error: true   # a scan failure must not fail the AVIF job
        env:
          WEBFLOW_API_TOKEN: ${{ secrets.WEBFLOW_API_TOKEN }}
        run: |
          set -uo pipefail          # NOT -e: we need to read the exit code below
          mkdir -p data
          touch data/watermark-clean-log.jsonl
          python scripts/watermark_cleaner.py scan \
            --site cel \
            --skip-known-clean data/watermark-clean-log.jsonl \
            --log-jsonl data/watermark-clean-log.jsonl \
            --summary-out data/watermark-scan-summary.json \
            --markdown-out data/watermark-scan-summary.md \
            --verbose
          rc=$?
          # `continue-on-error: true` makes the step green whatever happens, so
          # the scan's exit code was being thrown away entirely — exit 2 ("part
          # of the input was unreadable, status UNKNOWN") reached nobody, and
          # `Notify on failure` never fired. Capture it as an output instead.
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 2 ]; then
            echo "::warning::provenance scan could not read part of its input — coverage is incomplete, status UNKNOWN"
          elif [ "$rc" -ne 0 ]; then
            echo "::error::provenance scan failed with exit $rc"
          fi
          exit 0

      - name: Publish provenance summary to the job page
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          # The markdown is rendered by watermark_cleaner.render_markdown_summary()
          # (unit-tested) rather than by a Python heredoc embedded in this YAML —
          # that construction depends on three layers of indentation agreeing and
          # breaks silently when any is reflowed.
          #
          # Always emit something, even at zero findings: a health surface that
          # appears only on failure is indistinguishable from a broken one
          # (rules/infrastructure-discipline.md §4).
          if [ -f data/watermark-scan-summary.md ]; then
            cat data/watermark-scan-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## AI-provenance scan"
              echo ""
              echo "> Summary missing — the scan did not complete."
              echo "> Status is **UNKNOWN**, which is not the same as clean."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # ── AI-provenance SCRUB (manual + double-confirmed only) ───────────────
      # Guarded three ways: manual dispatch only, the checkbox, and the literal
      # word REPLACE typed into a second field. The script itself then demands
      # WATERMARK_CLEANER_CONFIRM=1, and refuses any asset whose re-upload would
      # change its asset id while a published page still points at the old URL.
      - name: Strip provenance metadata and re-upload (manual, confirmed)
        if: >-
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.scrub_provenance == 'true' &&
          github.event.inputs.scrub_confirm == 'REPLACE'
        env:
          WEBFLOW_API_TOKEN: ${{ secrets.WEBFLOW_API_TOKEN }}
          WATERMARK_CLEANER_CONFIRM: "1"
          ALLOW_NEW_ID: ${{ github.event.inputs.scrub_allow_new_asset_id }}
        run: |
          set -euo pipefail
          mkdir -p data/watermark-backup
          # A plain `EXTRA=()` expanded as "${EXTRA[@]}" is an "unbound variable"
          # error under `set -u` on bash < 4.4. ubuntu-latest has bash 5, so this
          # would have worked on the runner and failed for anyone testing on
          # macOS (bash 3.2) — a difference that hides until someone debugs the
          # workflow locally. Seed the array with the flag instead of appending
          # to an empty one, so it is never expanded while empty.
          if [ "${ALLOW_NEW_ID:-false}" = "true" ]; then
            EXTRA=(--allow-new-asset-id)
            echo "::warning::--allow-new-asset-id is set: asset URLs may change and Designer-placed references will NOT be rewritten."
          else
            EXTRA=(--check-live-pages)   # already the default; keeps the array non-empty
          fi
          python scripts/watermark_cleaner.py replace \
            --site cel \
            --apply \
            --site-url https://cel.englishcollege.com \
            --verify \
            --auto-publish \
            --log-jsonl data/watermark-clean-log.jsonl \
            --backup-dir data/watermark-backup \
            "${EXTRA[@]}"

      - name: Regenerate /admin/#images dashboard page
        if: always()  # render even if the optimizer hit a non-fatal image error
        run: |
          # Renders docs/admin/images/index.html from the (just-appended) log,
          # grouped by collection. EXTERNAL_REPO_ROOT auto-resolves to ./docs
          # in this CEL checkout (docs/index.html marker). Run as a module so
          # `from tools.dashboard import ...` resolves against the repo root.
          python -m tools.blog_images.generate_blog_page \
            --log-file data/blog-optimization-log.jsonl

      - name: Commit + push state
        if: always()
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          # Auto-resolve rebase conflicts on the regenerated dashboard HTML
          # (docs/admin/images/index.html etc. tagged merge=keepLatest in
          # .gitattributes) to THIS run's fresh copy — see content-pipeline.yml
          # for the full rationale and the rebase ours/theirs note.
          git config merge.keepLatest.driver 'cp %B %A'
          # Pull latest first to avoid conflicts with content-pipeline.yml
          # (every-15-min) running concurrently.
          git pull --rebase --autostash origin main || true
          git add data/blog-optimization-log.jsonl \
                  data/blog-richtext-backup/ \
                  sites/cel/shared/uploaded_assets.json \
                  docs/admin/images/index.html \
                  data/watermark-clean-log.jsonl \
                  data/watermark-scan-summary.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(blog-images): nightly AVIF optimization $(date -u +%Y-%m-%d)"
          # 5-attempt push retry w/ exponential backoff — guards transient
          # actions/checkout@v6 credential-read flakes + concurrent
          # content-pipeline pushes. Matches offers-*.yml.
          n=0
          until [ $n -ge 5 ]; do
            if ! git pull --rebase --autostash origin main; then
              git rebase --abort 2>/dev/null || true
              echo "pull/rebase failed (attempt $((n+1))) — retrying"
              n=$((n+1))
              sleep $((n * n))
              continue
            fi
            if git push origin main; then
              echo "push succeeded on attempt $((n+1))"
              exit 0
            fi
            n=$((n+1))
            echo "push failed on attempt $n, sleeping $((n * n))s"
            sleep $((n * n))
          done
          echo "ERROR: push failed after 5 attempts"
          exit 1

      - name: Notify on failure
        # `failure() || cancelled()` — NOT just failure(): a `timeout-minutes` expiry
        # marks the job `cancelled`, NOT `failed`, so `if: failure()` alone would NOT
        # fire on a timeout. blog-summary-autopilot timed out (cancelled) for 7 straight
        # days with ZERO alerts because of exactly this — the original "hung unnoticed"
        # incident, reopened. None of these workflows use concurrency cancel-in-progress,
        # so `cancelled()` only ever means a timeout or a manual cancel (both worth an alert).
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          # Ensure the ci-failure label exists (idempotent). `gh issue create --label`
          # aborts ATOMICALLY on a missing label → the alert is SILENTLY suppressed.
          # That is the exact bug tracker 138 hit: the label was never created in
          # either repo, so every notify step opened zero issues. Self-heal so the
          # alert works in any repo and survives the label being deleted.
          gh label create ci-failure --repo "${{ github.repository }}" \
            --color B60205 --description "Automated CI/cron failure alerts" --force >/dev/null 2>&1 || true
          TITLE="🔴 ${{ github.workflow }} failed"
          URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          NUM=$(gh issue list --repo "${{ github.repository }}" --label ci-failure --state open \
                  --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --repo "${{ github.repository }}" \
              --body "Failed again at $(date -u +%FT%TZ). Run: $URL"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" \
              --label ci-failure \
              --body "Scheduled workflow failed. Run: $URL. Auto-updates on repeat failures; close once resolved."
          fi
