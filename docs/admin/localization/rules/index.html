<style>

.rules { --muted: color-mix(in srgb, var(--fg) 76%, transparent); --faint: color-mix(in srgb, var(--fg) 74%, transparent); }
/* WCAG AA on this page (review CEL-046 fix 4): the dashboard's --muted (--fg at 65%) is 3.93:1 on the cream,
   --faint (45%) 2.40:1. Here they are --fg at 76% (5.30) and 74% (5.01). */
.rules .r-top { min-height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; padding: 12px 24px; }
.rules .r-title { margin: 0; font-size: var(--fs-xl); font-weight: 500; }
.rules .r-tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 24px; border-bottom: 1px solid var(--border); background: var(--stripe); }
.rules .r-tab { margin: 0 0 -1px; padding: 10px 14px; border: 0; border-bottom: 2px solid transparent; background: none; font: inherit; font-size: var(--fs-base); color: var(--muted); cursor: pointer; }
.rules .r-tab:hover { background: var(--stripe); color: var(--fg); }
.rules .r-tab[aria-selected="true"] { color: var(--fg); font-weight: 500; border-bottom-color: var(--fg); }
.rules .r-tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.rules .r-flag { margin-inline-end: 6px; }
.rules .r-main { max-width: 1360px; padding: 20px 24px 48px; }
.rules .r-lead { display: flex; flex-direction: column; justify-content: center; }
.rules .r-big { font-size: 28px; font-weight: 500; letter-spacing: -0.012em; line-height: 1.2; }
.rules .r-sub, .rules .r-intro { margin: 4px 0 0; font-size: var(--fs-md); color: var(--muted); }
.rules .r-layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 32px; }
/* the dashboard's sticky shell header is 59 px tall: the list and the jump targets sit below it */
.rules .r-rail { position: sticky; top: 76px; align-self: start; display: flex; flex-direction: column; gap: 1px; padding-top: 8px; }
.rules .r-rail-a { display: grid; grid-template-columns: 34px 1fr auto; gap: 6px; align-items: baseline; padding: 6px 8px; border-radius: var(--radius-sm); font-size: var(--fs-md); color: var(--fg); text-decoration: none; }
.rules .r-rail-a:hover { background: var(--stripe); }
.rules .r-rail-n { font-size: var(--fs-xs); color: var(--muted); }
.rules .r-no { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: var(--fs-sm); color: var(--muted); }
.rules .r-doc { min-width: 0; }
.rules .r-sec-head { display: flex; align-items: baseline; gap: 10px; margin: 0 0 4px; padding-bottom: 8px; border-bottom: 1px solid var(--border-strong); }
.rules .r-sec-head .r-sec-h { margin: 0; padding: 0; border: 0; }
.rules .r-sec { scroll-margin-top: 76px; }
.rules .r-sub { margin: 16px 0 4px; font-size: var(--fs-base); font-weight: 500; }
.rules .r-ctx { margin: 12px 0 0; font-size: var(--fs-md); color: var(--muted); }
.rules .r-qc { display: grid; grid-template-columns: minmax(0, 1fr) 210px; gap: 4px 24px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.rules .r-words { font-size: 15px; line-height: 1.55; overflow-wrap: anywhere; }
.rules .r-cell { display: inline-block; margin: 0 18px 2px 0; }
.rules .r-cell-h { display: block; font-size: var(--fs-xs); color: var(--muted); }
.rules .r-side { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.rules .r-how { font-size: var(--fs-sm); color: var(--muted); }
.rules .r-by { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 999px; font-size: var(--fs-sm); font-weight: 500; white-space: nowrap; }
.rules .r-mk { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid currentColor; flex: none; }
.rules .r-by.check { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }
.rules .r-by.check .r-mk { background: currentColor; }
.rules .r-by.prompt { color: var(--accent-strong); background: color-mix(in srgb, var(--accent-strong) 10%, transparent); }
.rules .r-by.prompt .r-mk { background: linear-gradient(90deg, currentColor 50%, transparent 50%); }
.rules .r-by.none { color: var(--notice-fg); background: color-mix(in srgb, var(--warn) 16%, transparent); }
.rules .r-by.warn { color: var(--notice-fg); border: 1px dashed var(--notice-fg); }
.rules .r-by.warn .r-mk { border-style: dashed; }
.rules .r-pairs { display: grid; gap: 16px; padding-top: 12px; }
.rules .r-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.rules .r-pair-k { grid-column: 1 / -1; font-size: var(--fs-md); font-weight: 500; }
.rules .r-good, .rules .r-bad { padding: 12px 14px; border-radius: 8px; font-size: var(--fs-base); line-height: 1.6; }
.rules .r-good { background: color-mix(in srgb, var(--ok) 10%, transparent); }
.rules .r-bad { background: color-mix(in srgb, var(--warn) 12%, transparent); }
.rules .r-lbl { display: block; margin-bottom: 4px; font-size: var(--fs-xs); font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; }
.rules .r-good .r-lbl { color: var(--ok); }
.rules .r-bad .r-lbl { color: var(--notice-fg); }
.rules .r-why { grid-column: 2; font-size: var(--fs-sm); color: var(--muted); }
.rules .r-drift { padding: 10px 14px; border-left: 3px solid var(--notice-fg); border-radius: 0 8px 8px 0; background: var(--stripe); font-size: var(--fs-md); }
.rules .r-sec { margin: 0 0 32px; }
.rules .r-sec-h { margin: 0 0 14px; padding-bottom: 8px; border-bottom: 1px solid var(--border); font-size: var(--fs-lg); font-weight: 500; }
.rules .r-text { font-size: var(--fs-doc-body, 16px); line-height: 1.65; overflow-wrap: anywhere; }
.rules .r-h { margin: 22px 0 6px; font-size: var(--fs-base); font-weight: 500; line-height: 1.4; }
.rules .r-h:first-child { margin-top: 0; }
.rules .r-p { margin: 0 0 10px; white-space: pre-wrap; }
.rules .r-items { margin: 0 0 12px; padding-left: 22px; }
.rules .r-item { margin: 0 0 6px; }
.rules .r-quote { margin: 0 0 10px; padding-left: 12px; border-left: 2px solid var(--border-strong); color: var(--muted); }
.rules .r-hr { border: 0; border-top: 1px solid var(--border); margin: 16px 0; }
.rules .r-text code { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: .92em; }
.rules .r-table { width: 100%; margin: 4px 0 14px; border-collapse: collapse; font-size: var(--fs-base); line-height: 1.5; }
.rules .r-table th, .rules .r-table td { padding: 8px 12px 8px 0; border-bottom: 1px solid var(--border); text-align: start; vertical-align: top; overflow-wrap: anywhere; }
.rules .r-table th { font-size: var(--fs-sm); font-weight: 500; color: var(--muted); }
.rules .r-empty { margin: 0; color: var(--muted); }
.rules .r-skel-line { height: 12px; margin: 12px 0; border-radius: var(--radius-sm); background: var(--stripe); }
.rules .r-notice { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 8px 12px; border: 1px solid var(--notice-border); border-radius: var(--radius-sm); background: var(--notice-bg); color: var(--notice-fg); font-size: var(--fs-base); }
.rules .r-notice p { margin: 0; }
.rules .r-foot { padding: 0 24px 32px; font-size: var(--fs-sm); }
.rules .r-foot a { color: var(--muted); text-decoration: none; white-space: nowrap; }
.rules .r-foot a:hover, .rules .r-foot a:focus-visible { color: var(--fg); text-decoration: underline; }
.rules [hidden] { display: none; }
@media (max-width: 1100px) {
  .rules .r-main { padding: 20px 16px 40px; }
  .rules .r-layout { grid-template-columns: 200px minmax(0, 1fr); gap: 24px; }
  .rules .r-tabs, .rules .r-top { padding-inline: 16px; }
}

/* CEL-113 (the editor, from CEL-110 option A with B's top menu): tokens only, weights 400/500, cream surfaces only */
.rules .r-rail-a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.rules .r-vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.rules .r-nav { display: flex; gap: 24px; padding: 0 24px; }
.rules .r-nav-b { margin: 0 0 -1px; padding: 6px 0 10px; border: 0; border-bottom: 2px solid transparent; background: none; font: inherit; font-size: var(--fs-lg); color: var(--muted); cursor: pointer; }
.rules .r-nav-b:hover { color: var(--fg); }
.rules .r-nav-b[aria-selected="true"] { color: var(--fg); font-weight: 500; border-bottom-color: var(--accent); }
.rules .r-nav-b:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.rules .r-sum-a { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin: 0 0 20px; }
.rules .r-id { justify-self: start; display: inline-block; padding: 1px 6px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); font-family: "SF Mono", Menlo, Consolas, monospace; font-size: var(--fs-xs); line-height: 16px; color: var(--muted); white-space: nowrap; }
.rules .r-id.is-new { border-style: dashed; }
.rules .r-state { display: block; margin-top: 4px; font-size: var(--fs-xs); font-weight: 500; }
.rules .r-state.is-new { color: var(--accent-strong); }
.rules .r-rule { display: grid; grid-template-columns: 64px minmax(0, 1fr) 150px 132px; gap: 4px 20px; align-items: start; padding: 12px 0; border-bottom: 1px solid var(--border); }
.rules .r-rule.is-editing, .rules .r-rule.is-new { margin-inline-start: -12px; padding-inline-start: 9px; border-inline-start: 3px solid var(--accent); }
.rules .r-acts { display: flex; justify-content: flex-end; gap: 2px; }
.rules .r-act { padding: 2px 6px; border: 0; border-radius: var(--radius-sm); background: none; font: inherit; font-size: var(--fs-sm); color: var(--accent-strong); cursor: pointer; }
.rules .r-act:hover { background: var(--stripe); }
.rules .r-act:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.rules .r-add { margin: 8px 0 0; padding: 6px 0; border: 0; background: none; font: inherit; font-size: var(--fs-md); color: var(--accent-strong); cursor: pointer; }
.rules .r-add:hover { text-decoration: underline; }
.rules .r-add:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.rules .r-search { display: flex; align-items: center; width: 280px; height: 32px; padding: 0 10px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--panel); }
.rules .r-search:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.rules .r-search input { flex: 1; min-width: 0; border: 0; background: none; font: inherit; font-size: var(--fs-md); color: var(--fg); outline: none; }
.rules .r-search input::placeholder { color: var(--muted); opacity: 1; }
.rules .r-input { width: 100%; min-height: 96px; padding: 8px 10px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--panel); font: inherit; font-size: 15px; line-height: 1.55; color: var(--fg); resize: vertical; }
.rules .r-input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.rules .r-input::placeholder { color: var(--muted); opacity: 1; }
.rules .r-editbox .r-notice { margin-top: 8px; }
.rules .r-edit-acts { display: flex; gap: 8px; margin-top: 8px; }
.rules .toast-close { width: auto; height: auto; padding: 2px 8px; border-radius: var(--radius-sm); color: var(--fg); font-size: var(--fs-sm); }
.rules .r-toast-t { flex: 1; }
/* CEL-113 Word list tab (CEL-110 option A): type chips, search and Add a word on one row, one table; Save applies */
.rules .r-field { width: 100%; padding: 8px 10px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--panel); font: inherit; font-size: var(--fs-base); color: var(--fg); }
.rules .r-field:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.rules .r-field::placeholder { color: var(--muted); opacity: 1; }
.rules .r-field:disabled { color: var(--muted); }
.rules .r-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.rules .r-chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border: 1px solid var(--border-strong); border-radius: 999px; background: none; font: inherit; font-size: var(--fs-md); color: var(--fg); cursor: pointer; }
.rules .r-chip:hover { background: var(--stripe); }
.rules .r-chip[aria-pressed="true"] { border-color: var(--fg); background: var(--selected); font-weight: 500; }
.rules .r-chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.rules .r-chip-n { font-size: var(--fs-sm); font-weight: 400; color: var(--muted); }
.rules .r-same { color: var(--muted); }
.rules .r-type { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 999px; font-size: var(--fs-sm); font-weight: 500; white-space: nowrap; }
.rules .r-type.is-keep { background: var(--selected); color: var(--fg); }
.rules .r-type.is-always { background: color-mix(in srgb, var(--accent-strong) 10%, transparent); color: var(--accent-strong); }
.rules .r-type.is-kw { border: 1px solid var(--border-strong); color: var(--fg); }
.rules .r-wtools { display: flex; align-items: center; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; margin: 0 0 16px; }
.rules .r-wtable th:nth-child(1) { width: 34%; }
.rules .r-wtable th:nth-child(3) { width: 180px; }
.rules .r-wtable th:nth-child(4) { width: 190px; }
.rules .r-wtable td { vertical-align: middle; }
.rules .r-w-term { font-weight: 500; }
.rules .r-w-acts { text-align: end; white-space: nowrap; }
.rules .r-w-acts .desk-btn + .desk-btn { margin-inline-start: 6px; }
.rules .r-wtable tr.is-adding td { background: var(--stripe); }
/* an element given a display above keeps [hidden] working (.rules [hidden] is one class weaker) */
.rules .r-rule[hidden], .rules .r-qc[hidden], .rules .r-sec[hidden], .rules .r-rail-a[hidden], .rules .r-add[hidden], .rules .desk-btn[hidden] { display: none; }

/* CEL-114 (the Import tab, from CEL-110 option A): tokens only, weights 400/500, cream surfaces only. The column is the
   Rules tab's: .r-main caps the content, so at 2560 px the three steps are as wide as the rules, not a narrower strip */
.rules .r-steps { margin: 0; padding: 0; list-style: none; }
.rules .r-step { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 16px; padding: 16px 0 20px; border-bottom: 1px solid var(--border); }
.rules .r-step-n { display: grid; place-items: center; width: 28px; height: 28px; border: 1px solid var(--fg); border-radius: 50%; font-size: var(--fs-md); font-weight: 500; }
.rules .r-step-h { margin: 3px 0 14px; font-size: var(--fs-lg); font-weight: 500; }
.rules .r-files { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.rules .r-file { display: flex; flex-direction: column; justify-content: space-between; gap: 14px; padding: 14px 16px; border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--panel); }
.rules .r-file-h { margin: 0; font-size: var(--fs-base); font-weight: 500; }
.rules .r-file-acts { display: flex; align-items: center; gap: 8px; }
.rules .r-drop { padding: 28px; border: 1.5px dashed var(--border-strong); border-radius: var(--radius); background: var(--panel); text-align: center; }
.rules .r-drop-p { margin: 0; font-size: var(--fs-base); }
.rules .r-drop-cap { margin: 6px 0 0; font-size: var(--fs-sm); color: var(--muted); }
.rules .r-upl { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--panel); }
.rules .r-upl-name { font-weight: 500; overflow-wrap: anywhere; }
.rules .r-upl-meta { flex: 1; font-size: var(--fs-sm); color: var(--muted); }
.rules .r-sub-a { margin: 0 0 4px; font-size: var(--fs-base); font-weight: 500; }
.rules .r-plang { display: flex; align-items: baseline; gap: 4px; margin: 16px 0 0; padding-bottom: 6px; border-bottom: 1px solid var(--border-strong); font-size: var(--fs-base); font-weight: 500; }
.rules .r-plang-n { margin-inline-start: 6px; font-size: var(--fs-sm); font-weight: 400; color: var(--muted); }
.rules .r-pchg { display: grid; grid-template-columns: 72px 84px minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; padding: 12px 0; border-bottom: 1px solid var(--border); }
.rules .r-pcol { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.rules .r-pcap { font-size: var(--fs-xs); color: var(--muted); }
.rules .r-was, .rules .r-now, .rules .r-gone { padding: 8px 12px; border-radius: 8px; font-size: var(--fs-base); line-height: 1.55; overflow-wrap: anywhere; }
.rules .r-was { background: var(--stripe); }
.rules .r-was.is-none { background: none; padding-inline: 0; color: var(--muted); }
.rules .r-now { background: color-mix(in srgb, var(--ok) 10%, transparent); }
.rules .r-gone { background: color-mix(in srgb, var(--err) 8%, transparent); color: var(--err); text-decoration: line-through; }
.rules .r-wmeta { font-size: var(--fs-sm); color: var(--muted); }
.rules .r-gone .r-wmeta { color: var(--err); }
.rules .r-kind { font-size: var(--fs-sm); font-weight: 500; }
.rules .r-kind.is-chg { color: var(--fg); }
.rules .r-kind.is-add { color: var(--ok); }
.rules .r-kind.is-del { color: var(--err); }
.rules .r-unplaced { margin: 20px 0 0; padding: 12px 16px; border: 1px solid var(--notice-border); border-radius: var(--radius); background: var(--notice-bg); }
.rules .r-un-h { margin: 0 0 6px; font-size: var(--fs-base); font-weight: 500; color: var(--notice-fg); }
.rules .r-un-list { margin: 0; padding: 0; list-style: none; }
.rules .r-un-i { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; padding: 8px 0; border-top: 1px solid var(--notice-border); font-size: var(--fs-base); }
.rules .r-un-why { color: var(--notice-fg); }
.rules .r-pub-a { display: flex; gap: 8px; margin: 20px 0 0; }
.rules .r-preview .r-notice { margin-top: 16px; }
.rules .r-act:disabled { color: var(--muted); cursor: default; }
</style>

  <script>(function () {
    function setText(id, val) { var el = document.getElementById(id); if (el) el.textContent = val; }
    function fullName(u) { return [u.firstName || '', u.lastName || ''].join(' ').trim() || (u.email || 'Account'); }
    var currentUser = (window.__CEL_USER__ && window.__CEL_USER__.email) ? window.__CEL_USER__ : null;
    var changePwBtn = document.getElementById('shell-change-pw');
    if (currentUser && currentUser.email) {
      setText('shell-user-name', currentUser.firstName || currentUser.email);
      setText('shell-user-fullname', fullName(currentUser));
      setText('shell-user-email', currentUser.email);
      setText('cpw-first', currentUser.firstName || '—');
      setText('cpw-last', currentUser.lastName || '—');
      setText('cpw-email', currentUser.email);
    } else if (changePwBtn) {
      changePwBtn.style.display = 'none';
    }

    var logoutBtn = document.getElementById('shell-logout');
    if (logoutBtn) logoutBtn.addEventListener('click', function () {
      document.cookie = 'cel_session=; Max-Age=0; Path=/; Secure; SameSite=Strict';
      location.replace('/');
    });

    function sha256hex(str) {
      return crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)).then(function (buf) {
        return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
      });
    }
    function innerHash(pw) { return sha256hex(pw); }
    function pwHashOf(pw) { return sha256hex(pw).then(sha256hex); }

    var DISPATCH_URL = (typeof window.CEL_DISPATCH_URL === 'string') ? window.CEL_DISPATCH_URL : '';
    function callProxy(payload) {
      if (!DISPATCH_URL) return Promise.reject(new Error('Password tool not configured yet.'));
      var m = document.cookie.match(/(?:^|; )cel_session=([^;]*)/);
      payload.token = m ? m[1] : '';
      return fetch(DISPATCH_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
        .then(function (resp) {
          return resp.json().catch(function () { return {}; }).then(function (j) {
            return { status: resp.status, ok: resp.ok && j.ok !== false, body: j };
          });
        });
    }

    var overlay = document.getElementById('cpw-overlay');
    var cpwForm = document.getElementById('cpw-form');
    var cpwStatus = document.getElementById('cpw-status');
    var cpwSave = document.getElementById('cpw-save');
    if (changePwBtn && overlay && cpwForm) {
      function closeModal() {
        overlay.setAttribute('hidden', '');
        cpwForm.reset();
        cpwStatus.textContent = '';
        cpwStatus.className = 'cpw-status';
        cpwSave.disabled = false;
      }
      changePwBtn.addEventListener('click', function () {
        var dd = document.getElementById('shell-user');
        if (dd) dd.removeAttribute('open');
        overlay.removeAttribute('hidden');
        document.getElementById('cpw-current').focus();
      });
      document.getElementById('cpw-cancel').addEventListener('click', closeModal);
      overlay.addEventListener('click', function (ev) { if (ev.target === overlay) closeModal(); });
      cpwForm.addEventListener('submit', function (ev) {
        ev.preventDefault();
        if (!currentUser || !currentUser.email) return;
        var cur = document.getElementById('cpw-current').value;
        var nw = document.getElementById('cpw-new').value;
        var cf = document.getElementById('cpw-confirm').value;
        if (!cur || !nw) return;
        if (nw !== cf) {
          cpwStatus.textContent = 'New passwords do not match.';
          cpwStatus.className = 'cpw-status is-error';
          return;
        }
        cpwSave.disabled = true;
        cpwStatus.textContent = 'Saving…';
        cpwStatus.className = 'cpw-status';
        Promise.all([innerHash(cur), pwHashOf(nw)]).then(function (h) {
          return callProxy({ action: 'changepw', email: currentUser.email, cur_hash: h[0], new_pw_hash: h[1] });
        }).then(function (r) {
          if (r.ok) {
            cpwStatus.textContent = '✓ Saved — use your new password next time you sign in.';
            cpwStatus.className = 'cpw-status is-ok';
          } else {
            cpwStatus.textContent = '✗ Current password is incorrect.';
            cpwStatus.className = 'cpw-status is-error';
            cpwSave.disabled = false;
          }
        }).catch(function () {
          cpwStatus.textContent = '✗ Could not save right now. Please try again.';
          cpwStatus.className = 'cpw-status is-error';
          cpwSave.disabled = false;
        });
      });
    }
})();
</script>

    function t(key, vals) {
      var s = COPY[key];
      if (s === undefined) { console.error('COPY.md has no ' + key); return '\u27e6' + key + '\u27e7'; }
      return s.replace(/\{([A-Za-z_]+)\}/g, function (m, name) {
        if (!vals || !(name in vals)) { console.error('COPY.md ' + key + ' needs {' + name + '}'); return m; }
        return String(vals[name]);
      });
    }
    function tn(key, n, vals) {
      var v = { n: n };
      for (var k in (vals || {})) v[k] = vals[k];
      return t(key + (n === 1 ? '.one' : '.other'), v);
    }
    function callProxy(payload, ms) {
      var url = window.CEL_DISPATCH_URL;
      if (!url) return Promise.reject(new Error('not configured'));
      var m = document.cookie.match(/(?:^|; )cel_session=([^;]*)/);
      payload.token = m ? m[1] : '';
      var ctl = ms && window.AbortController ? new AbortController() : null;
      var timer = ctl ? setTimeout(function () { ctl.abort(); }, ms) : null;
      return fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
        signal: ctl ? ctl.signal : undefined
      }).then(function (resp) {
        return resp.json().catch(function () { return {}; }).then(function (j) {
          return { status: resp.status, ok: resp.ok && j.ok !== false, body: j };
        });
      }).finally(function () { if (timer) clearTimeout(timer); });
    }

    (function () {
      var tip = document.createElement('div');
      tip.className = 'desk-tip';
      tip.setAttribute('role', 'tooltip');
      tip.hidden = true;
      document.body.appendChild(tip);
      var owner = null, timer = null;
      function hide() { clearTimeout(timer); timer = null; owner = null; tip.hidden = true; }
      function show(el) {
        var text = el.getAttribute('data-tip');
        if (!text) { hide(); return; }
        owner = el;
        tip.textContent = text;
        tip.hidden = false;
        var r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight, gap = 8;
        var top = r.top - h - gap;
        if (top < gap) top = r.bottom + gap;
        var left = Math.min(Math.max(gap, r.left + r.width / 2 - w / 2), window.innerWidth - w - gap);
        tip.style.left = left + 'px';
        tip.style.top = top + 'px';
      }
      function later(el, ms) { clearTimeout(timer); timer = setTimeout(function () { show(el); }, ms); }
      document.addEventListener('pointerover', function (ev) {
        if (ev.pointerType === 'touch') return;
        var el = ev.target.closest && ev.target.closest('[data-tip]');
        if (el && el !== owner) later(el, 100);
      });
      document.addEventListener('pointerout', function (ev) {
        var el = ev.target.closest && ev.target.closest('[data-tip]');
        if (el && (!ev.relatedTarget || !el.contains(ev.relatedTarget))) hide();
      });
      document.addEventListener('focusin', function (ev) {
        var el = ev.target.closest && ev.target.closest('[data-tip]');
        if (el && el.matches(':focus-visible')) show(el);
      });
      document.addEventListener('focusout', hide);
      document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') hide(); });
      window.addEventListener('scroll', hide, true);
      document.addEventListener('pointerdown', function (ev) {
        var el = ev.target.closest && ev.target.closest('[data-tip]');
        if (ev.pointerType === 'touch' && el) later(el, 500);
      });
      ['pointerup', 'pointercancel'].forEach(function (type) {
        document.addEventListener(type, function (ev) {
          if (ev.pointerType === 'touch') { clearTimeout(timer); if (!tip.hidden) setTimeout(hide, 1500); }
        });
      });
      // A click changes what the control says ("Approved -- click to undo"): say it now.
      document.addEventListener('click', function () {
        var el = owner;
        if (el) setTimeout(function () { if (owner === el) show(el); }, 0);
      });
    })();
</script>

<script type="text/plain" id="rules-import-template"># Translation rules: changes template

I made this file so an AI tool can write your changes for you. You do not need to write the format yourself.

1. Copy the prompt in part 1 into Claude or ChatGPT.
2. Below the prompt, tell it what you want changed, in your own words. If you downloaded "Your current rules" from the Import tab, paste it too, so the AI can use the right rule IDs.
3. Save the answer as a .md file and upload it on the Import tab. I show you every change before anything is applied.

## 1. Prompt for your AI tool

Copy everything between the two lines of equals signs.

~~~
==========
You help me change the translation rules of an English language school website.
Write a "changes only" file in Markdown. Follow these rules exactly.

OUTPUT
- Output only the changes file. No explanations, no greetings, no sign-off.
- Keep it short. Cut every unnecessary word. One change per line.
- Do not repeat rules or words that stay the same.

LANGUAGES
- One section per language, as a heading: ## German (DE)
- Use only these 8 codes: DE German, FR French, ES Spanish, PT Portuguese, IT Italian, JA Japanese, KO Korean, AR Arabic.
- Put the changes of each language only in its own section.

RULES (under the heading ### Rules)
- New rule: - ADD: <rule text>
- Change a rule: - EDIT DE-12: <the complete new text>
- Delete a rule: - REMOVE DE-12
- Every rule has an ID such as DE-12. Always keep the ID exactly as I give it when you edit or remove.
- Never invent an ID. A new rule has no ID.
- An EDIT replaces the whole rule, so write the complete new text.

WORDS (under the heading ### Words)
- A table with the columns: | Action | Term | Translation | Type |
- Action is ADD, EDIT or REMOVE. Term is the English term.
- Type is exactly one of: Keep as is, Always translate as, Search keyword.
- Keep as is: brand and place names that stay untranslated. Leave Translation empty.
- Always translate as: the translation must be exactly this.
- Search keyword: a search phrase, used where it sounds natural.
- For REMOVE, fill only Action and Term.

Do not add anything I did not ask for.

MY CHANGES:
(I write my wishes here, or paste my rules file.)
==========
~~~

## 2. The format, in short

| What | Line |
|---|---|
| Language | `## German (DE)` |
| Add a rule | `- ADD: text` |
| Change a rule | `- EDIT DE-12: complete new text` |
| Delete a rule | `- REMOVE DE-12` |
| Word change | `\| ADD \| term \| translation \| Type \|` |

Type is one of: Keep as is, Always translate as, Search keyword.
A small slip, such as a wrong bullet or a broken table, is fine. I read the file with an AI model and show you what I understood. A line I cannot place is listed under "Couldn't place these lines", and nothing changes until you Apply.

## 3. Your changes

Save the AI's answer as its own .md file and upload that file.
If you write your changes in this file instead, put them below this line and delete everything above the line before you upload it.

---
</script>

/* Rules page: Markdown body <-> blocks. One block per editable unit
   (heading, list item, quote line, paragraph, table row); unchanged blocks
   keep their raw source, so parse -> serialize is byte-equal. Runs in the
   page (window.RulesMd) and in node for the round-trip test. */
(function (root) {

  const HEAD = /^(#{1,6} )(.*)$/;
  const ITEM = /^(\s*(?:[-*+]|\d+[.)]) )(.*)$/;

  function splitRow(line) {

      const c = s[i];
      if (c === '\\' && s[i + 1] === '|') { cur += '\\|'; i++; continue; }
      if (c === '|') { out.push(cur.trim()); cur = ''; continue; }
      cur += c;
    }
    out.push(cur.trim());
    return out;
  }

  function cellText(t) {

    return String(t).replace(/\r?\n/g, ' ').replace(/\\\|/g, '\u0000').replace(/\|/g, '\\|').replace(/\u0000/g, '\\|');
  }

  function joinRow(cells) {
    return '| ' + cells.map(cellText).join(' | ') + ' |';
  }

  /* A block: {kind, raw, prefix, text, cells?, level?}. kind is one of
     head, item, quote, para, row, sep, hr, blank. Only head, item, quote,
     para and row are editable. */
  function parse(body) {
    const lines = String(body == null ? '' : body).split('\n');
    const blocks = [];
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      let m;
      if (line.trim() === '') { blocks.push({ kind: 'blank', raw: line }); continue; }
      if (HR.test(line)) { blocks.push({ kind: 'hr', raw: line }); continue; }
      if ((m = HEAD.exec(line))) {
        blocks.push({ kind: 'head', raw: line, prefix: m[1], text: m[2], level: m[1].length - 1 });
        continue;
      }
      if (SEP.test(line)) { blocks.push({ kind: 'sep', raw: line }); continue; }
      if (ROW.test(line)) { blocks.push({ kind: 'row', raw: line, cells: splitRow(line) }); continue; }
      if ((m = ITEM.exec(line))) { blocks.push({ kind: 'item', raw: line, prefix: m[1], text: m[2] }); continue; }
      if ((m = QUOTE.exec(line))) { blocks.push({ kind: 'quote', raw: line, prefix: m[1], text: m[2] }); continue; }

        if (nx.trim() === '' || HR.test(nx) || HEAD.test(nx) || ROW.test(nx) || ITEM.test(nx) || QUOTE.test(nx)) break;
        para.push(nx);

      const raw = para.join('\n');
      blocks.push({ kind: 'para', raw: raw, prefix: '', text: raw });

  function rawOf(b) {
    if (b.edited) {
      if (b.kind === 'row') return joinRow(b.cells);
      return (b.prefix || '') + b.text;

  function serialize(blocks) {
    return blocks.map(rawOf).join('\n');
  }

  /* Split a parsed body into sections at each level-2 heading. The part
     before the first `##` is section 0 (title + intro), which may be empty. */
  function sections(blocks) {
    const out = [{ head: null, blocks: [] }];
    blocks.forEach(function (b, i) {

      else out[out.length - 1].blocks.push(b);

  /* Glossary: one table | English | <Language> | Keep as is |. */
  function parseGlossary(body) {
    const rows = [];
    parse(body).forEach(function (b) {

      rows.push(b.cells);

    const un = function (s) { return String(s || '').replace(/\\\|/g, '|'); };

<script>
/* Rules page, Import tab: "Download current rules" Markdown. Pure (no DOM) apart from the Blob download: builds the
   file the client hands to their AI tool. Rule lines are kept exactly as stored, the trailing ` [DE-12]` ID included;
   the word list becomes a table Term | Translation | Type (the stored words:<lang> body, read by parseWordsBody).
   Runs in the page (window.RulesDownload) and in node (tests/test_download_rules_md.py). */
(function (root) {
  'use strict';

  const TYPE_NAMES = {
    keep: 'Keep as is',
    translate: 'Always translate as',
    keyword: 'Search keyword'
  };
  const EXACT = ['Keep as is', 'Always translate as', 'Search keyword'];
  const SEP = /^\s*\|(\s*:?-{2,}:?\s*\|)+\s*$/;

  /* A cell: one line, the pipe escaped as the stored word list writes it (\|), so a row cannot break. */
  function cell(t) {
    return String(t == null ? '' : t)
      .replace(/\r?\n/g, ' ')
      .replace(/\|/g, '\\|')

  }

    const s = String(t == null ? '' : t).trim();

  function parseWordsBody(body) {
    const out = [];

      if (cells[0].toLowerCase() === 'term' && cells[2].toLowerCase() === 'type') return;
      out.push({ term: cells[0], translation: cells[1], type: cells[2] });
    });
    return out;
  }

  /* words: [{term, translation, type}] where type is one of the three names (or the keys keep | translate | keyword). */
  function rulesDownloadMarkdown(opts) {
    const o = opts || {};
    const language = String(o.language || '').trim();
    const body = String(o.rulesBody == null ? '' : o.rulesBody).replace(/\s+$/, '');
    const words = Array.isArray(o.words) ? o.words : [];

    out.push('# ' + (language ? language + ' ' : '') + 'translation rules');
    out.push('');
    out.push('## Rules');
    out.push('');
    out.push(body === '' ? '(no rules stored yet)' : body);
    out.push('');
    out.push('## Word list');
    out.push('');
    out.push('| Term | Translation | Type |');
    out.push('| --- | --- | --- |');
    if (words.length === 0) {
      out.push('| (no words yet) |  |  |');

      words.forEach(function (w) {

    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
  }

  function downloadRulesMd(language, text) {
    saveText('cel-rules-' + String(language || 'rules').toLowerCase().replace(/[^a-z0-9-]+/g, '-') + '.md', text);
  }

    rulesDownloadMarkdown: rulesDownloadMarkdown, parseWordsBody: parseWordsBody,

<script>
/*
 * The Import tab of the rules page (CEL-114; design: CEL-110 option A, Import German). Three numbered steps:
 *   1 Get the files   - Copy prompt (clipboard), Download current rules (one language, .md, with the rule IDs),
 *                       Download template (the changes template as a new .md file)
 *   2 Upload your changes - one .md/.txt file, up to 64 KB, chosen or dropped

  // ── writing: each Save, Remove and Add is ONE rules write that applies at once ───────────────────────
  // The write carries the version this page read (`baseVersion`). A 409 means someone changed the language first:
  // the message says so, the typed text stays in its open row. Undo is one more write, of the body as it was.
  function problem(o, r, lang) {
    let msg;
    if (r && r.status === 409) msg = t('rules.apply.stale', { language: langName(lang) });
    else if (!r || r.status === 401 || r.status === 429) msg = t(failureKey(r));

  // `scope` is the language (its rules) or `words:<lang>`; the write carries that scope's own version.

  }
  // `prevBody` (words only) is what Undo writes back when the scope had no body to write back. The language is the
  // scope's own, never the tab shown now: a write that waited on a read still goes to, and reports on, its language.
  function commit(o, newBody, label, doneKey, scope0, prevBody) {
    const scope = scope0 || S.lang, lang = scope.indexOf('words:') === 0 ? scope.slice(6) : scope;
    const s = sc(scope), prev = prevBody != null ? prevBody : s.body;
    S.busy = true;
    root.dataset.busy = 'true';
    return put(scope, newBody).then(function (r) {
      S.busy = false;
      delete root.dataset.busy;
      if (r && r.ok) {
        s.body = newBody;
        if (r.body && Number.isInteger(r.body.version)) s.version = r.body.version;
        if (S.open === o) S.open = null;
        if (S.wopen === o) S.wopen = null;

  // The number after the highest this language ever used: the body now and every body in its history (a removed

  function nextNumber(lang, body) {

    return call({ action: 'desk-rules-history', scope: lang }).then(function (r) {

  // ── the Word list tab: one table of the language's words (scope `words:<lang>`), chips by Type, a search, ────────

  // The chips and the search hide the words that do not match; an open row is never hidden. Nothing is read or written.

  // ── the desk's toast (document_desk.js toast(), with an Undo): a message goes after a few seconds, an error stays ──

      u.type = 'button';
      u.addEventListener('click', function () { drop(); undoFn(); });
      node.appendChild(u);
    }
    if (level === 'err' || level === 'warn') {
      const x = h('button', 'toast-close', t('toast.close'));
      x.type = 'button';
      x.addEventListener('click', drop);
      node.appendChild(x);
    } else setTimeout(drop, TIMING.toast);
    stack.appendChild(node);
  }

  // ── the page ─────────────────────────────────────────────────────────────────────
  // Rules and Word list are drawn here; Import (rules_import.js, CEL-114) draws into the same panel.
  // The Import tab keeps its own state; it gets the page's helpers and the Worker door.
  const IMP = window.RulesImport && window.RulesDownload ? window.RulesImport.create({
    h: h, textNode: textNode, call: call, toast: toast, langName: langName, locales: LOCALES,
    lang: function () { return S.lang; }, rerender: render, failure: failureKey,
    invalidate: function () { S.scopes = {}; load(); },          // the rules changed: the next view reads them again
  }) : null;
  function renderTab() {
    if (S.tab === 'rules') return renderLang();
    if (S.tab === 'words') return renderWords();
    if (S.tab === 'import' && IMP) return IMP.render();
    const wrap = h('div', 'r-page');
    wrap.id = 'rules-' + S.tab;
    return wrap;
  }
  function render() {
    tabs.forEach(function (b) {
      const on = b.dataset.lang === S.lang;
      b.setAttribute('aria-selected', on ? 'true' : 'false');
      b.tabIndex = on ? 0 : -1;
    });
    navs.forEach(function (b) {
      const on = b.dataset.ptab === S.tab;
      b.setAttribute('aria-selected', on ? 'true' : 'false');
      b.tabIndex = on ? 0 : -1;
    });
    panel.setAttribute('aria-labelledby', 'rulesTab-' + S.lang);
    panel.dataset.lang = S.lang;
    panel.dataset.ptab = S.tab;
    panel.textContent = '';
    panel.appendChild(renderTab());
    if (S.tab === 'rules') applyFilter();
    if (S.tab === 'words') {
      applyWordFilter();
      const last = S.wlast;
      S.wlast = null;
      if (last) {                                      // the word just added is at the end of the table: show it
        const row = Array.prototype.find.call(panel.querySelectorAll('.r-wtable .r-w-term'), function (x) { return x.textContent === last; });
        if (row && row.scrollIntoView) row.scrollIntoView({ block: 'nearest' });
      }
    }
    if (S.open && S.open.focus) {
      const ta = $('#rules-ed', panel);
      S.open.focus = false;
      if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
    }
    if (S.wopen && S.wopen.focus) {
      const f = $('#words-ed-term', panel);
      S.wopen.focus = false;
      if (f) { f.focus(); f.setSelectionRange(f.value.length, f.value.length); }
    }
  }

  // ── the language tabs ────────────────────────────────────────────────────────────
  // "Back to the desk" opens the desk on the language shown here (CEL-069, shell-spec §4).
  function deskLink() {
    const a = document.getElementById('rules-desk');
    if (a) a.setAttribute('href', '/admin/localization/document/?lang=' + encodeURIComponent(S.lang));
  }
  function choose(code, focus) {
    if (!known(code)) return;
    const b = tabs.find(function (x) { return x.dataset.lang === code; });
    if (code !== S.lang) {
      S.lang = code;
      S.open = null;                       // an open editor belongs to the language it was opened in
      S.wopen = null;
      S.q = '';                            // and a search starts empty on each language
      S.wq = '';
      S.wtype = 'all';
      const u = new URL(location.href);
      u.searchParams.set('lang', code);
      history.replaceState(null, '', u);
      deskLink();
      load();
    }
    if (focus && b) b.focus();
  }
  // Alt+1..8 picks the language (shell-spec §5): Alt alone (AltGr = Ctrl+Alt types), the digit's code (on a Mac
  // `key` is the character), no IME composition, focus outside a text box. Otherwise the key is left alone.
  document.addEventListener('keydown', function (e) {
    if (!e.altKey || e.ctrlKey || e.metaKey || e.isComposing) return;
    const at = document.activeElement;
    if (at && (/^(INPUT|TEXTAREA|SELECT)$/.test(at.tagName) || (at.closest && at.closest('[contenteditable]:not([contenteditable="false"])')))) return;
    const m = /^Digit([1-8])$/.exec(e.code || '');
    if (!m || !LOCALES[Number(m[1]) - 1]) return;
    e.preventDefault();
    choose(LOCALES[Number(m[1]) - 1].code, false);
  });
  // The page tabs (B's top menu): Rules / Word list / Import, the language stays.
  function pick(ptab, focus) {
    if (PTABS.indexOf(ptab) < 0) return;
    if (ptab !== S.tab) {
      S.tab = ptab;
      S.open = null;
      S.wopen = null;
      const u = new URL(location.href);
      u.searchParams.set('tab', ptab);
      history.replaceState(null, '', u);
      load();                              // the tab reads its own scopes; one already read is not asked again
    }
    if (focus) { const b = navs.find(function (x) { return x.dataset.ptab === ptab; }); if (b) b.focus(); }
  }
  navs.forEach(function (b, i) {
    b.addEventListener('click', function () { pick(b.dataset.ptab, false); });
    b.addEventListener('keydown', function (e) {
      let to = null;
      if (e.key === 'ArrowRight') to = navs[(i + 1) % navs.length];
      else if (e.key === 'ArrowLeft') to = navs[(i - 1 + navs.length) % navs.length];
      if (!to) return;
      e.preventDefault();
      pick(to.dataset.ptab, true);
    });
  });
  tabs.forEach(function (b, i) {
    b.addEventListener('click', function () { choose(b.dataset.lang, false); });
    b.addEventListener('keydown', function (e) {
      let to = null;
      if (e.key === 'ArrowRight') to = tabs[(i + 1) % tabs.length];
      else if (e.key === 'ArrowLeft') to = tabs[(i - 1 + tabs.length) % tabs.length];
      else if (e.key === 'Home') to = tabs[0];
      else if (e.key === 'End') to = tabs[tabs.length - 1];
      if (!to) return;
      e.preventDefault();
      choose(to.dataset.lang, true);
    });
  });

  deskLink();
  load();
})();
</script>
</body>
</html>
