  <script>(function () {
    function setText(id, val) { var el = document.getElementById(id); if (el) el.textContent = val; }
    function fullName(u) { return [u.firstName || '', u.lastName || ''].join(' ').trim() || (u.email || 'Account'); }
    var currentUser = (window.__CEL_USER__ && window.__CEL_USER__.email) ? window.__CEL_USER__ : null;
    var changePwBtn = document.getElementById('shell-change-pw');
    if (currentUser && currentUser.email) {
      setText('shell-user-name', currentUser.firstName || currentUser.email);
      setText('shell-user-fullname', fullName(currentUser));
      setText('shell-user-email', currentUser.email);
      setText('cpw-first', currentUser.firstName || '—');
      setText('cpw-last', currentUser.lastName || '—');
      setText('cpw-email', currentUser.email);
    } else if (changePwBtn) {
      changePwBtn.style.display = 'none';
    }

    var logoutBtn = document.getElementById('shell-logout');
    if (logoutBtn) logoutBtn.addEventListener('click', function () {
      document.cookie = 'cel_session=; Max-Age=0; Path=/; Secure; SameSite=Strict';
      location.replace('/');
    });

    function sha256hex(str) {
      return crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)).then(function (buf) {
        return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
      });
    }
    function innerHash(pw) { return sha256hex(pw); }
    function pwHashOf(pw) { return sha256hex(pw).then(sha256hex); }

    var DISPATCH_URL = (typeof window.CEL_DISPATCH_URL === 'string') ? window.CEL_DISPATCH_URL : '';
    function callProxy(payload) {
      if (!DISPATCH_URL) return Promise.reject(new Error('Password tool not configured yet.'));
      var m = document.cookie.match(/(?:^|; )cel_session=([^;]*)/);
      payload.token = m ? m[1] : '';
      return fetch(DISPATCH_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
        .then(function (resp) {
          return resp.json().catch(function () { return {}; }).then(function (j) {
            return { status: resp.status, ok: resp.ok && j.ok !== false, body: j };
          });
        });
    }

    var overlay = document.getElementById('cpw-overlay');
    var cpwForm = document.getElementById('cpw-form');
    var cpwStatus = document.getElementById('cpw-status');
    var cpwSave = document.getElementById('cpw-save');
    if (changePwBtn && overlay && cpwForm) {
      function closeModal() {
        overlay.setAttribute('hidden', '');
        cpwForm.reset();
        cpwStatus.textContent = '';
        cpwStatus.className = 'cpw-status';
        cpwSave.disabled = false;
      }
      changePwBtn.addEventListener('click', function () {
        var dd = document.getElementById('shell-user');
        if (dd) dd.removeAttribute('open');
        overlay.removeAttribute('hidden');
        document.getElementById('cpw-current').focus();
      });
      document.getElementById('cpw-cancel').addEventListener('click', closeModal);
      overlay.addEventListener('click', function (ev) { if (ev.target === overlay) closeModal(); });
      cpwForm.addEventListener('submit', function (ev) {
        ev.preventDefault();
        if (!currentUser || !currentUser.email) return;
        var cur = document.getElementById('cpw-current').value;
        var nw = document.getElementById('cpw-new').value;
        var cf = document.getElementById('cpw-confirm').value;
        if (!cur || !nw) return;
        if (nw !== cf) {
          cpwStatus.textContent = 'New passwords do not match.';
          cpwStatus.className = 'cpw-status is-error';
          return;
        }
        cpwSave.disabled = true;
        cpwStatus.textContent = 'Saving…';
        cpwStatus.className = 'cpw-status';
        Promise.all([innerHash(cur), pwHashOf(nw)]).then(function (h) {
          return callProxy({ action: 'changepw', email: currentUser.email, cur_hash: h[0], new_pw_hash: h[1] });
        }).then(function (r) {
          if (r.ok) {
            cpwStatus.textContent = '✓ Saved — use your new password next time you sign in.';
            cpwStatus.className = 'cpw-status is-ok';
          } else {
            cpwStatus.textContent = '✗ Current password is incorrect.';
            cpwStatus.className = 'cpw-status is-error';
            cpwSave.disabled = false;
          }
        }).catch(function () {
          cpwStatus.textContent = '✗ Could not save right now. Please try again.';
          cpwStatus.className = 'cpw-status is-error';
          cpwSave.disabled = false;
        });
      });
    }
})();
</script>

      if (s === undefined) { console.error('COPY.md has no ' + key); return '\u27e6' + key + '\u27e7'; }
      return s.replace(/\{([A-Za-z_]+)\}/g, function (m, name) {

        return String(vals[name]);
      });
    }
    function tn(key, n, vals) {

    function callProxy(payload, ms) {
      var url = window.CEL_DISPATCH_URL;
      if (!url) return Promise.reject(new Error('not configured'));
      var m = document.cookie.match(/(?:^|; )cel_session=([^;]*)/);
      payload.token = m ? m[1] : '';
      var ctl = ms && window.AbortController ? new AbortController() : null;
      var timer = ctl ? setTimeout(function () { ctl.abort(); }, ms) : null;
      return fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
        signal: ctl ? ctl.signal : undefined
      }).then(function (resp) {
        return resp.json().catch(function () { return {}; }).then(function (j) {
          return { status: resp.status, ok: resp.ok && j.ok !== false, body: j };
        });
      }).finally(function () { if (timer) clearTimeout(timer); });
    }

    (function () {
      var tip = document.createElement('div');
      tip.className = 'desk-tip';
      tip.setAttribute('role', 'tooltip');
      tip.hidden = true;
      document.body.appendChild(tip);
      var owner = null, timer = null;
      function hide() { clearTimeout(timer); timer = null; owner = null; tip.hidden = true; }
      function show(el) {
        var text = el.getAttribute('data-tip');
        if (!text) { hide(); return; }
        owner = el;
        tip.textContent = text;
        tip.hidden = false;
        var r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight, gap = 8;
        var top = r.top - h - gap;
        if (top < gap) top = r.bottom + gap;
        var left = Math.min(Math.max(gap, r.left + r.width / 2 - w / 2), window.innerWidth - w - gap);
        tip.style.left = left + 'px';
        tip.style.top = top + 'px';
      }
      function later(el, ms) { clearTimeout(timer); timer = setTimeout(function () { show(el); }, ms); }
      document.addEventListener('pointerover', function (ev) {
        if (ev.pointerType === 'touch') return;
        var el = ev.target.closest && ev.target.closest('[data-tip]');
        if (el && el !== owner) later(el, 100);
      });
      document.addEventListener('pointerout', function (ev) {
        var el = ev.target.closest && ev.target.closest('[data-tip]');
        if (el && (!ev.relatedTarget || !el.contains(ev.relatedTarget))) hide();
      });
      document.addEventListener('focusin', function (ev) {
        var el = ev.target.closest && ev.target.closest('[data-tip]');
        if (el && el.matches(':focus-visible')) show(el);
      });
      document.addEventListener('focusout', hide);
      document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') hide(); });
      window.addEventListener('scroll', hide, true);
      document.addEventListener('pointerdown', function (ev) {
        var el = ev.target.closest && ev.target.closest('[data-tip]');
        if (ev.pointerType === 'touch' && el) later(el, 500);
      });
      ['pointerup', 'pointercancel'].forEach(function (type) {
        document.addEventListener(type, function (ev) {
          if (ev.pointerType === 'touch') { clearTimeout(timer); if (!tip.hidden) setTimeout(hide, 1500); }
        });
      });
      // A click changes what the control says ("Approved -- click to undo"): say it now.
      document.addEventListener('click', function () {
        var el = owner;
        if (el) setTimeout(function () { if (owner === el) show(el); }, 0);
      });
    })();

<script>
/* Rules page: Markdown body <-> blocks. One block per editable unit
   (heading, list item, quote line, paragraph, table row); unchanged blocks
   keep their raw source, so parse -> serialize is byte-equal. Runs in the
   page (window.RulesMd) and in node for the round-trip test. */
(function (root) {
  'use strict';

  const HEAD = /^(#{1,6} )(.*)$/;
  const ITEM = /^(\s*(?:[-*+]|\d+[.)]) )(.*)$/;
  const QUOTE = /^(>\s?)(.*)$/;
  const HR = /^\s*(?:-{3,}|\*{3,}|_{3,})\s*$/;
  const ROW = /^\s*\|.*\|\s*$/;
  const SEP = /^\s*\|(\s*:?-{2,}:?\s*\|)+\s*$/;

  function splitRow(line) {
    const s = line.trim().replace(/^\|/, '').replace(/\|$/, '');
    const out = [];
    let cur = '';
    for (let i = 0; i < s.length; i++) {
      const c = s[i];
      if (c === '\\' && s[i + 1] === '|') { cur += '\\|'; i++; continue; }
      if (c === '|') { out.push(cur.trim()); cur = ''; continue; }
      cur += c;
    }
    out.push(cur.trim());
    return out;
  }

  function cellText(t) {
    // every pipe not already escaped, adjacent ones included (a||b -> a\|\|b)
    return String(t).replace(/\r?\n/g, ' ').replace(/\\\|/g, '\u0000').replace(/\|/g, '\\|').replace(/\u0000/g, '\\|');
  }

  function joinRow(cells) {
    return '| ' + cells.map(cellText).join(' | ') + ' |';
  }

  /* A block: {kind, raw, prefix, text, cells?, level?}. kind is one of
     head, item, quote, para, row, sep, hr, blank. Only head, item, quote,
     para and row are editable. */
  function parse(body) {
    const lines = String(body == null ? '' : body).split('\n');
    const blocks = [];
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      let m;
      if (line.trim() === '') { blocks.push({ kind: 'blank', raw: line }); continue; }
      if (HR.test(line)) { blocks.push({ kind: 'hr', raw: line }); continue; }
      if ((m = HEAD.exec(line))) {
        blocks.push({ kind: 'head', raw: line, prefix: m[1], text: m[2], level: m[1].length - 1 });
        continue;
      }
      if (SEP.test(line)) { blocks.push({ kind: 'sep', raw: line }); continue; }
      if (ROW.test(line)) { blocks.push({ kind: 'row', raw: line, cells: splitRow(line) }); continue; }
      if ((m = ITEM.exec(line))) { blocks.push({ kind: 'item', raw: line, prefix: m[1], text: m[2] }); continue; }
      if ((m = QUOTE.exec(line))) { blocks.push({ kind: 'quote', raw: line, prefix: m[1], text: m[2] }); continue; }
      /* a paragraph runs until a blank line or another block starts */
      const para = [line];
      while (i + 1 < lines.length) {
        const nx = lines[i + 1];
        if (nx.trim() === '' || HR.test(nx) || HEAD.test(nx) || ROW.test(nx) || ITEM.test(nx) || QUOTE.test(nx)) break;
        para.push(nx);
        i++;
      }
      const raw = para.join('\n');
      blocks.push({ kind: 'para', raw: raw, prefix: '', text: raw });
    }
    return blocks;
  }

  function rawOf(b) {
    if (b.edited) {
      if (b.kind === 'row') return joinRow(b.cells);
      return (b.prefix || '') + b.text;
    }
    return b.raw;
  }

  function serialize(blocks) {
    return blocks.map(rawOf).join('\n');
  }

  /* Split a parsed body into sections at each level-2 heading. The part
     before the first `##` is section 0 (title + intro), which may be empty. */
  function sections(blocks) {
    const out = [{ head: null, blocks: [] }];
    blocks.forEach(function (b, i) {
      if (b.kind === 'head' && b.level === 2) out.push({ head: b, index: i, blocks: [] });
      else out[out.length - 1].blocks.push(b);
    });
    return out;
  }

  /* Glossary: one table | English | <Language> | Keep as is |. */
  function parseGlossary(body) {
    const rows = [];
    parse(body).forEach(function (b) {
      if (b.kind !== 'row') return;
      rows.push(b.cells);
    });
    const un = function (s) { return String(s || '').replace(/\\\|/g, '|'); };
    const terms = rows.slice(1).map(function (c) {
      return { en: un(c[0]), to: un(c[1]), keep: /^\s*yes\s*$/i.test(c[2] || '') };
    });
    return { header: rows[0] || null, terms: terms };
  }

<script>
/*
 * The rules page of the localization desk: /admin/localization/rules/ (CEL-080, read-only version 1).
 * The client picks a language and reads the translation rules the engine gives Gemini for it: that
 * language's own rule set (one self-contained block per language since CEL-085; the old shared `global`
 * scope is retired and never read), its glossary and the client's keyword brief for each page that has one
 * (Worker scopes `<lang>`, `glossary:<lang>`, `brief:<page>:<lang>`, read with desk-rules-read). Nothing on
 * this page edits, saves or publishes. Editing comes back in a later version.
 *
 * generate_rules_page.py inlines rules_md.js, then this file. It reads the globals the page defines first:
 * COPY with t() (every word comes from COPY.md) and callProxy() (the Worker door). DOM is built with
 * createElement / textContent only.

  'use strict';

  const LOCALES = CFG.locales;            // [{code, name, flag}]
  const PAGES = CFG.pages;                // the desk's page keys, in the desk's order (labels: page.<key>)

  const root = document.getElementById('rules-app');
  if (!root) return;

  function h(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;

  }

  };

  };
  const sc = function (scope) {
    if (!S.scopes[scope]) S.scopes[scope] = { state: 'loading', body: null, key: null };
    return S.scopes[scope];
  };

  }
