.rules { --muted: color-mix(in srgb, var(--fg) 76%, transparent); --faint: color-mix(in srgb, var(--fg) 74%, transparent); }
/* WCAG AA on this page (review CEL-046 fix 4): the dashboard's --muted (--fg at 65%) is 3.93:1 on the cream,
   --faint (45%) 2.40:1. Here they are --fg at 76% (5.30) and 74% (5.01). */
.rules .r-top { min-height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; padding: 12px 24px; }
.rules .r-title { margin: 0; font-size: var(--fs-xl); font-weight: 500; }
.rules .r-tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 24px; border-bottom: 1px solid var(--border); }
.rules .r-tab { margin: 0 0 -1px; padding: 10px 14px; border: 0; border-bottom: 2px solid transparent; background: none; font: inherit; font-size: var(--fs-base); color: var(--muted); cursor: pointer; }
.rules .r-tab:hover { background: var(--stripe); color: var(--fg); }
.rules .r-tab[aria-selected="true"] { color: var(--fg); font-weight: 500; border-bottom-color: var(--fg); }
.rules .r-tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.rules .r-main { max-width: 1360px; padding: 20px 24px 48px; }
.rules .r-sum { display: grid; grid-template-columns: 1.4fr repeat(3, 1fr); gap: 12px; margin: 0 0 8px; }
.rules .r-lead { display: flex; flex-direction: column; justify-content: center; }
.rules .r-big { font-size: 28px; font-weight: 500; letter-spacing: -0.012em; line-height: 1.2; }
.rules .r-sub, .rules .r-intro { margin: 4px 0 0; font-size: var(--fs-md); color: var(--muted); }
.rules .r-stat { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 12px 14px; border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--panel); font: inherit; color: var(--fg); text-align: start; cursor: pointer; }
.rules .r-stat:hover { background: var(--stripe); }
.rules .r-stat[aria-pressed="true"] { border-color: var(--fg); background: var(--selected); }
.rules .r-stat:focus-visible, .rules .r-clear:focus-visible, .rules .r-rail-a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.rules .r-num { font-size: 24px; font-weight: 500; line-height: 1.2; }

.rules .r-filterline { margin: 0 0 16px; font-size: var(--fs-sm); color: var(--muted); }
.rules .r-clear { padding: 0; border: 0; background: none; font: inherit; color: var(--accent-strong); cursor: pointer; }
.rules .r-layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 32px; }
/* the dashboard's sticky shell header is 59 px tall: the list and the jump targets sit below it */
.rules .r-rail { position: sticky; top: 76px; align-self: start; display: flex; flex-direction: column; gap: 1px; padding-top: 8px; }
.rules .r-rail-a { display: grid; grid-template-columns: 34px 1fr auto; gap: 6px; align-items: baseline; padding: 6px 8px; border-radius: var(--radius-sm); font-size: var(--fs-md); color: var(--fg); text-decoration: none; }
.rules .r-rail-a:hover { background: var(--stripe); }
.rules .r-rail-n { font-size: var(--fs-xs); color: var(--muted); }
.rules .r-no { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: var(--fs-sm); color: var(--muted); }
.rules .r-doc { min-width: 0; }
.rules .r-sec-head { display: flex; align-items: baseline; gap: 10px; margin: 0 0 4px; padding-bottom: 8px; border-bottom: 1px solid var(--border-strong); }
.rules .r-sec-head .r-sec-h { margin: 0; padding: 0; border: 0; }
.rules .r-sec { scroll-margin-top: 76px; }
.rules .r-sub { margin: 16px 0 4px; font-size: var(--fs-base); font-weight: 500; }
.rules .r-ctx { margin: 12px 0 0; font-size: var(--fs-md); color: var(--muted); }
.rules .r-req { display: grid; grid-template-columns: minmax(0, 1fr) 210px; gap: 4px 24px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.rules .r-words { font-size: 15px; line-height: 1.55; overflow-wrap: anywhere; }
.rules .r-cell { display: inline-block; margin: 0 18px 2px 0; }
.rules .r-cell-h { display: block; font-size: var(--fs-xs); color: var(--muted); }
.rules .r-side { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.rules .r-how { font-size: var(--fs-sm); color: var(--muted); }
.rules .r-by { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 999px; font-size: var(--fs-sm); font-weight: 500; white-space: nowrap; }
.rules .r-mk { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid currentColor; flex: none; }
.rules .r-by.check { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }
.rules .r-by.check .r-mk { background: currentColor; }
.rules .r-by.prompt { color: var(--accent-strong); background: color-mix(in srgb, var(--accent-strong) 10%, transparent); }
.rules .r-by.prompt .r-mk { background: linear-gradient(90deg, currentColor 50%, transparent 50%); }
.rules .r-by.none { color: var(--notice-fg); background: color-mix(in srgb, var(--warn) 16%, transparent); }
.rules .r-by.warn { color: var(--notice-fg); border: 1px dashed var(--notice-fg); }
.rules .r-by.warn .r-mk { border-style: dashed; }
.rules .r-pairs { display: grid; gap: 16px; padding-top: 12px; }
.rules .r-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.rules .r-pair-k { grid-column: 1 / -1; font-size: var(--fs-md); font-weight: 500; }
.rules .r-good, .rules .r-bad { padding: 12px 14px; border-radius: 8px; font-size: var(--fs-base); line-height: 1.6; }
.rules .r-good { background: color-mix(in srgb, var(--ok) 10%, transparent); }
.rules .r-bad { background: color-mix(in srgb, var(--warn) 12%, transparent); }
.rules .r-lbl { display: block; margin-bottom: 4px; font-size: var(--fs-xs); font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; }
.rules .r-good .r-lbl { color: var(--ok); }
.rules .r-bad .r-lbl { color: var(--notice-fg); }
.rules .r-why { grid-column: 2; font-size: var(--fs-sm); color: var(--muted); }
.rules .r-drift { padding: 10px 14px; border-left: 3px solid var(--notice-fg); border-radius: 0 8px 8px 0; background: var(--stripe); font-size: var(--fs-md); }
.rules .r-briefs { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; padding-top: 12px; }
.rules .r-sec { margin: 0 0 32px; }

.rules .r-text { font-size: var(--fs-doc-body, 16px); line-height: 1.65; overflow-wrap: anywhere; }
.rules .r-h { margin: 22px 0 6px; font-size: var(--fs-base); font-weight: 500; line-height: 1.4; }
.rules .r-h:first-child { margin-top: 0; }
.rules .r-p { margin: 0 0 10px; white-space: pre-wrap; }
.rules .r-items { margin: 0 0 12px; padding-left: 22px; }
.rules .r-item { margin: 0 0 6px; }
.rules .r-quote { margin: 0 0 10px; padding-left: 12px; border-left: 2px solid var(--border-strong); color: var(--muted); }
.rules .r-hr { border: 0; border-top: 1px solid var(--border); margin: 16px 0; }
.rules .r-text code { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: .92em; }
.rules .r-table { width: 100%; margin: 4px 0 14px; border-collapse: collapse; font-size: var(--fs-base); line-height: 1.5; }
.rules .r-table th, .rules .r-table td { padding: 8px 12px 8px 0; border-bottom: 1px solid var(--border); text-align: start; vertical-align: top; overflow-wrap: anywhere; }
.rules .r-table th { font-size: var(--fs-sm); font-weight: 500; color: var(--muted); }
.rules .r-empty { margin: 0; color: var(--muted); }
.rules .r-brief { padding: 0 16px; border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--panel); }
.rules .r-brief-h { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 0; font-size: var(--fs-base); font-weight: 500; cursor: pointer; }
.rules .r-brief-h:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.rules .r-brief > .r-text { padding: 0 0 14px; }
.rules .r-skel-line { height: 12px; margin: 12px 0; border-radius: var(--radius-sm); background: var(--stripe); }
.rules .r-notice { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 8px 12px; border: 1px solid var(--notice-border); border-radius: var(--radius-sm); background: var(--notice-bg); color: var(--notice-fg); font-size: var(--fs-base); }
.rules .r-notice p { margin: 0; }
.rules .r-foot { padding: 0 24px 32px; font-size: var(--fs-sm); }
.rules .r-foot a { color: var(--muted); text-decoration: none; white-space: nowrap; }
.rules .r-foot a:hover, .rules .r-foot a:focus-visible { color: var(--fg); text-decoration: underline; }
.rules [hidden] { display: none; }
@media (max-width: 1100px) {
  .rules .r-main { padding: 20px 16px 40px; }
  .rules .r-layout { grid-template-columns: 200px minmax(0, 1fr); gap: 24px; }
  .rules .r-tabs, .rules .r-top { padding-inline: 16px; }
}
</style>

  <script>(function () {
    function setText(id, val) { var el = document.getElementById(id); if (el) el.textContent = val; }
    function fullName(u) { return [u.firstName || '', u.lastName || ''].join(' ').trim() || (u.email || 'Account'); }
    var currentUser = (window.__CEL_USER__ && window.__CEL_USER__.email) ? window.__CEL_USER__ : null;
    var changePwBtn = document.getElementById('shell-change-pw');
    if (currentUser && currentUser.email) {
      setText('shell-user-name', currentUser.firstName || currentUser.email);
      setText('shell-user-fullname', fullName(currentUser));
      setText('shell-user-email', currentUser.email);
      setText('cpw-first', currentUser.firstName || '—');
      setText('cpw-last', currentUser.lastName || '—');
      setText('cpw-email', currentUser.email);
    } else if (changePwBtn) {
      changePwBtn.style.display = 'none';
    }

    var logoutBtn = document.getElementById('shell-logout');
    if (logoutBtn) logoutBtn.addEventListener('click', function () {
      document.cookie = 'cel_session=; Max-Age=0; Path=/; Secure; SameSite=Strict';
      location.replace('/');
    });

    function sha256hex(str) {
      return crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)).then(function (buf) {
        return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
      });
    }
    function innerHash(pw) { return sha256hex(pw); }
    function pwHashOf(pw) { return sha256hex(pw).then(sha256hex); }

    var DISPATCH_URL = (typeof window.CEL_DISPATCH_URL === 'string') ? window.CEL_DISPATCH_URL : '';
    function callProxy(payload) {
      if (!DISPATCH_URL) return Promise.reject(new Error('Password tool not configured yet.'));
      var m = document.cookie.match(/(?:^|; )cel_session=([^;]*)/);
      payload.token = m ? m[1] : '';
      return fetch(DISPATCH_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
        .then(function (resp) {
          return resp.json().catch(function () { return {}; }).then(function (j) {
            return { status: resp.status, ok: resp.ok && j.ok !== false, body: j };
          });
        });
    }

    var overlay = document.getElementById('cpw-overlay');
    var cpwForm = document.getElementById('cpw-form');
    var cpwStatus = document.getElementById('cpw-status');
    var cpwSave = document.getElementById('cpw-save');
    if (changePwBtn && overlay && cpwForm) {
      function closeModal() {
        overlay.setAttribute('hidden', '');
        cpwForm.reset();
        cpwStatus.textContent = '';
        cpwStatus.className = 'cpw-status';
        cpwSave.disabled = false;
      }
      changePwBtn.addEventListener('click', function () {
        var dd = document.getElementById('shell-user');
        if (dd) dd.removeAttribute('open');
        overlay.removeAttribute('hidden');
        document.getElementById('cpw-current').focus();
      });
      document.getElementById('cpw-cancel').addEventListener('click', closeModal);
      overlay.addEventListener('click', function (ev) { if (ev.target === overlay) closeModal(); });
      cpwForm.addEventListener('submit', function (ev) {
        ev.preventDefault();
        if (!currentUser || !currentUser.email) return;
        var cur = document.getElementById('cpw-current').value;
        var nw = document.getElementById('cpw-new').value;
        var cf = document.getElementById('cpw-confirm').value;
        if (!cur || !nw) return;
        if (nw !== cf) {
          cpwStatus.textContent = 'New passwords do not match.';
          cpwStatus.className = 'cpw-status is-error';
          return;
        }
        cpwSave.disabled = true;
        cpwStatus.textContent = 'Saving…';
        cpwStatus.className = 'cpw-status';
        Promise.all([innerHash(cur), pwHashOf(nw)]).then(function (h) {
          return callProxy({ action: 'changepw', email: currentUser.email, cur_hash: h[0], new_pw_hash: h[1] });
        }).then(function (r) {
          if (r.ok) {
            cpwStatus.textContent = '✓ Saved — use your new password next time you sign in.';
            cpwStatus.className = 'cpw-status is-ok';
          } else {
            cpwStatus.textContent = '✗ Current password is incorrect.';
            cpwStatus.className = 'cpw-status is-error';
            cpwSave.disabled = false;
          }
        }).catch(function () {
          cpwStatus.textContent = '✗ Could not save right now. Please try again.';
          cpwStatus.className = 'cpw-status is-error';
          cpwSave.disabled = false;
        });
      });
    }
})();
</script>

    function t(key, vals) {
      var s = COPY[key];
      if (s === undefined) { console.error('COPY.md has no ' + key); return '\u27e6' + key + '\u27e7'; }
      return s.replace(/\{([A-Za-z_]+)\}/g, function (m, name) {
        if (!vals || !(name in vals)) { console.error('COPY.md ' + key + ' needs {' + name + '}'); return m; }
        return String(vals[name]);
      });
    }
    function tn(key, n, vals) {
      var v = { n: n };
      for (var k in (vals || {})) v[k] = vals[k];
      return t(key + (n === 1 ? '.one' : '.other'), v);
    }
    function callProxy(payload, ms) {
      var url = window.CEL_DISPATCH_URL;
      if (!url) return Promise.reject(new Error('not configured'));
      var m = document.cookie.match(/(?:^|; )cel_session=([^;]*)/);
      payload.token = m ? m[1] : '';
      var ctl = ms && window.AbortController ? new AbortController() : null;
      var timer = ctl ? setTimeout(function () { ctl.abort(); }, ms) : null;
      return fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
        signal: ctl ? ctl.signal : undefined
      }).then(function (resp) {
        return resp.json().catch(function () { return {}; }).then(function (j) {
          return { status: resp.status, ok: resp.ok && j.ok !== false, body: j };
        });
      }).finally(function () { if (timer) clearTimeout(timer); });
    }

    (function () {
      var tip = document.createElement('div');
      tip.className = 'desk-tip';
      tip.setAttribute('role', 'tooltip');
      tip.hidden = true;
      document.body.appendChild(tip);
      var owner = null, timer = null;
      function hide() { clearTimeout(timer); timer = null; owner = null; tip.hidden = true; }
      function show(el) {
        var text = el.getAttribute('data-tip');
        if (!text) { hide(); return; }
        owner = el;
        tip.textContent = text;
        tip.hidden = false;
        var r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight, gap = 8;
        var top = r.top - h - gap;
        if (top < gap) top = r.bottom + gap;
        var left = Math.min(Math.max(gap, r.left + r.width / 2 - w / 2), window.innerWidth - w - gap);
        tip.style.left = left + 'px';
        tip.style.top = top + 'px';
      }
      function later(el, ms) { clearTimeout(timer); timer = setTimeout(function () { show(el); }, ms); }
      document.addEventListener('pointerover', function (ev) {
        if (ev.pointerType === 'touch') return;
        var el = ev.target.closest && ev.target.closest('[data-tip]');
        if (el && el !== owner) later(el, 100);
      });
      document.addEventListener('pointerout', function (ev) {
        var el = ev.target.closest && ev.target.closest('[data-tip]');
        if (el && (!ev.relatedTarget || !el.contains(ev.relatedTarget))) hide();
      });
      document.addEventListener('focusin', function (ev) {
        var el = ev.target.closest && ev.target.closest('[data-tip]');
        if (el && el.matches(':focus-visible')) show(el);
      });
      document.addEventListener('focusout', hide);
      document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') hide(); });
      window.addEventListener('scroll', hide, true);
      document.addEventListener('pointerdown', function (ev) {
        var el = ev.target.closest && ev.target.closest('[data-tip]');
        if (ev.pointerType === 'touch' && el) later(el, 500);
      });
      ['pointerup', 'pointercancel'].forEach(function (type) {
        document.addEventListener(type, function (ev) {
          if (ev.pointerType === 'touch') { clearTimeout(timer); if (!tip.hidden) setTimeout(hide, 1500); }
        });
      });
      // A click changes what the control says ("Approved -- click to undo"): say it now.
      document.addEventListener('click', function () {
        var el = owner;
        if (el) setTimeout(function () { if (owner === el) show(el); }, 0);
      });

/* Rules page: Markdown body <-> blocks. One block per editable unit
   (heading, list item, quote line, paragraph, table row); unchanged blocks
   keep their raw source, so parse -> serialize is byte-equal. Runs in the
   page (window.RulesMd) and in node for the round-trip test. */

    parse: parse,
    serialize: serialize,
    rawOf: rawOf,
    sections: sections,
    splitRow: splitRow,
    joinRow: joinRow,
    parseGlossary: parseGlossary,
    serializeGlossary: serializeGlossary,
    firstChange: firstChange,
  };

          if (b.kind === 'item' && indented(b)) { rows.push({ kind: 'ctx', text: b.text }); return; }
          if (leadIn(b)) { rows.push({ kind: 'ctx', text: b.text }); return; }
          rows.push({ kind: 'req', text: b.text, raw: b.raw, d: doneBy(lang, b.raw) });
        });
        secs.push({ no: m[1], title: m[2], rows: rows });
        return;
      }
      if (/^Snippet\s/.test(p.head.text)) {
        const pair = { k: p.head.text.replace(/^Snippet\s+\d+\s*[—-]\s*/, ''), good: '', bad: '', why: '' };
        let want = null;
        p.blocks.forEach(function (b) {
          const s = (b.text || '').trim();
          if (/^\*\*Good \(/.test(s)) { want = 'good'; return; }
          if (/^\*\*Bad \(/.test(s)) { want = 'bad'; return; }
          if (/^\*\*Source \(/.test(s)) { want = null; return; }
          if (/^\*Why this fails:\*/.test(s)) { pair.why = s.replace(/^\*Why this fails:\*\s*/, ''); return; }
          if (b.kind === 'quote' && want) { pair[want] += (pair[want] ? ' ' : '') + b.text; }
        });
        if (pair.good && pair.bad) pairs.push(pair);
        return;
      }
      if (/^Drift modes/.test(p.head.text)) {
        p.blocks.forEach(function (b) { if (b.kind === 'item') drift.push(b.text); });
      }
    });
    return { intro: intro, secs: secs, pairs: pairs, drift: drift };
  }

  // ── the sections ─────────────────────────────────────────────────────────────────
  function skeleton() {
    const sk = h('div', 'r-skel');
    sk.setAttribute('aria-hidden', 'true');
    for (let i = 0; i < 4; i++) sk.appendChild(h('div', 'r-skel-line'));
    return sk;
  }
  // A scope that could not be read says why, with Try again.
  function notice(scope) {
    const s = sc(scope);
    const box = h('div', 'r-notice');
    box.setAttribute('role', 'alert');
    box.appendChild(h('p', null, t(s.key || 'rules.error.read')));
    const b = h('button', 'desk-btn', t('rules.retry'));
    b.type = 'button';
    b.addEventListener('click', function () { s.state = 'loading'; load(); });
    box.appendChild(b);
    return box;
  }
  function section(id, heading, no) {
    const sec = h('section', 'r-sec');
    sec.id = id;
    const head = h('div', 'r-sec-head');
    if (no) head.appendChild(h('span', 'r-no', '§' + no));
    head.appendChild(textNode('h2', 'r-sec-h', heading));
    sec.appendChild(head);
    return sec;
  }
  // The text of a scope, or its skeleton / notice. `fill(body, into)` draws a body that was read.
  function scopeBody(scope, sec, fill) {
    const s = sc(scope);
    if (s.state === 'loading') { sec.appendChild(skeleton()); return; }
    if (s.state === 'error') { sec.appendChild(notice(scope)); return; }
    const body = h('div', 'r-text');
    fill(s.body, body);
    sec.appendChild(body);
  }
  function reqRow(r) {
    const row = h('div', 'r-req');
    row.dataset.by = r.d.by;
    if (S.by !== 'all' && r.d.by !== S.by) row.hidden = true;
    const words = h('div', 'r-words');
    if (r.cells) {
      r.cells.forEach(function (c, i) {
        const cell = h('span', 'r-cell');
        if (r.header && r.header[i]) cell.appendChild(textNode('span', 'r-cell-h', r.header[i]));
        inline(cell, c);
        words.appendChild(cell);
      });
    } else inline(words, r.text);
    row.appendChild(words);
    const side = h('div', 'r-side');
    side.appendChild(pill(r.d.by));
    if (r.d.warn) {
      const w = h('span', 'r-by warn');
      w.appendChild(h('span', 'r-mk'));
      w.appendChild(document.createTextNode(t('rules.by.warn')));
      w.dataset.tip = t('rules.by.warn.tip');
      side.appendChild(w);
    }
    side.appendChild(h('span', 'r-how', howText(r.d)));
    row.appendChild(side);
    return row;
  }
  function renderSec(s) {
    const sec = section('rules-s' + s.no, s.title, s.no);
    s.rows.forEach(function (r) {
      if (r.kind === 'sub') sec.appendChild(textNode('h3', 'r-sub', r.text));
      else if (r.kind === 'ctx') sec.appendChild(textNode('p', 'r-ctx', r.text));
      else sec.appendChild(reqRow(r));
    });
    return sec;
  }
  function renderTone(doc) {
    const sec = section('rules-tone', t('rules.tone'));
    const box = h('div', 'r-pairs');
    doc.pairs.forEach(function (p) {
      const pair = h('div', 'r-pair');
      pair.appendChild(textNode('div', 'r-pair-k', p.k));
      const good = h('div', 'r-good');
      good.appendChild(h('span', 'r-lbl', t('rules.tone.good')));
      inline(good, p.good);
      const bad = h('div', 'r-bad');
      bad.appendChild(h('span', 'r-lbl', t('rules.tone.bad')));
      inline(bad, p.bad);
      pair.appendChild(good);
      pair.appendChild(bad);
      if (p.why) {
        const why = h('div', 'r-why');
        why.appendChild(document.createTextNode(t('rules.tone.why') + ' '));
        inline(why, p.why);
        pair.appendChild(why);
      }
      box.appendChild(pair);
    });
    doc.drift.forEach(function (d) {
      const line = h('div', 'r-drift');
      line.appendChild(h('strong', null, t('rules.tone.drift') + ' '));
      inline(line, d);
      box.appendChild(line);
    });
    sec.appendChild(box);
    return sec;
  }
  function renderGlossary() {
    const lang = S.lang;
    const sec = section('rules-glossary', t('rules.glossary'));
    scopeBody('glossary:' + lang, sec, function (body, into) {
      const terms = M.parseGlossary(body).terms;
      if (!terms.length) { into.appendChild(h('p', 'r-empty', t('rules.glossary.empty'))); return; }
      const rows = [[t('rules.glossary.en'), langName(lang), t('rules.glossary.keep')]];
      terms.forEach(function (term) { rows.push([term.en, term.to, term.keep ? t('rules.glossary.yes') : '']); });
      const table = tableOf(rows, true);
      table.classList.add('r-glossary');
      into.appendChild(table);
    });
    return sec;
  }
  // The client's keyword brief per page (CEL-085): one card per page that has one, under the page's English
  // name, its text collapsed; none for this language says so. One notice if a brief could not be read.
  function renderBriefs() {
    const lang = S.lang;
    const sec = section('rules-briefs', t('rules.briefs'));
    const scopes = PAGES.map(function (p) { return briefScope(p, lang); });
    if (scopes.some(function (x) { return sc(x).state === 'loading'; })) { sec.appendChild(skeleton()); return sec; }
    const failed = scopes.find(function (x) { return sc(x).state === 'error'; });
    if (failed) { sec.appendChild(notice(failed)); return sec; }
    const given = PAGES.filter(function (p) { return String(sc(briefScope(p, lang)).body || '').trim(); });
    if (!given.length) { sec.appendChild(h('p', 'r-empty', t('rules.briefs.empty'))); return sec; }
    const grid = h('div', 'r-briefs');
    given.forEach(function (p) {
      const box = h('details', 'r-brief');
      box.dataset.page = p;
      const sum = h('summary', 'r-brief-h');
      sum.appendChild(h('span', 'r-brief-name', t('page.' + p)));
      sum.appendChild(pill('prompt'));
      box.appendChild(sum);
      const body = h('div', 'r-text');
      renderBlocks(M.parse(sc(briefScope(p, lang)).body), body);
      box.appendChild(body);
      grid.appendChild(box);
    });
    sec.appendChild(grid);
    return sec;
  }
  function count(doc) {
    const c = { all: 0, check: 0, prompt: 0, none: 0 };
    doc.secs.forEach(function (s) {
      s.rows.forEach(function (r) { if (r.kind === 'req') { c.all++; c[r.d.by]++; } });
    });
    return c;
  }
  function renderSummary(doc, into) {
    const c = count(doc);
    const sum = h('div', 'r-sum');
    const lead = h('div', 'r-lead');
    lead.appendChild(h('div', 'r-big', t('rules.summary', { n: c.all })));
    lead.appendChild(h('div', 'r-sub', t('rules.summary.sub', { language: langName(S.lang) })));
    doc.intro.forEach(function (b) { lead.appendChild(textNode('p', 'r-intro', b.text)); });
    sum.appendChild(lead);
    ['check', 'prompt', 'none'].forEach(function (by) {
      const b = h('button', 'r-stat');
      b.type = 'button';
      b.dataset.by = by;
      b.setAttribute('aria-pressed', S.by === by ? 'true' : 'false');
      b.appendChild(pill(by));
      b.appendChild(h('span', 'r-num', String(c[by])));
      b.appendChild(h('span', 'r-cap', t(CAP_KEY[by])));
      b.addEventListener('click', function () { S.by = S.by === by ? 'all' : by; render(); });
      sum.appendChild(b);
    });
    into.appendChild(sum);
    const line = h('p', 'r-filterline');
    if (S.by === 'all') line.textContent = t('rules.filter.all', { n: c.all });
    else {
      line.appendChild(document.createTextNode(t('rules.filter.some', { k: c[S.by], n: c.all }) + ' '));
      const clear = h('button', 'r-clear', t('rules.filter.clear'));
      clear.type = 'button';
      clear.addEventListener('click', function () { S.by = 'all'; render(); });
      line.appendChild(clear);
    }
    into.appendChild(line);
  }
  function railLink(id, label, n, no) {
    const a = h('a', 'r-rail-a');
    a.href = '#' + id;
    a.appendChild(h('span', 'r-no', no ? '§' + no : ''));
    a.appendChild(textNode('span', 'r-rail-t', label));
    a.appendChild(h('span', 'r-rail-n', n ? String(n) : ''));
    return a;
  }
  function renderLang() {
    const lang = S.lang;
    const wrap = h('div', 'r-page');
    wrap.id = 'rules-lang';
    const s = sc(lang);
    if (s.state === 'loading') { wrap.appendChild(skeleton()); return wrap; }
    if (s.state === 'error') { wrap.appendChild(notice(lang)); return wrap; }
    if (isSeedNone(s.body)) {
      wrap.appendChild(h('p', 'r-empty', t('rules.empty', { language: langName(lang) })));
      return wrap;
    }
    const doc = readBlock(lang, s.body);
    renderSummary(doc, wrap);
    const layout = h('div', 'r-layout');
    const rail = h('nav', 'r-rail');
    rail.setAttribute('aria-label', t('rules.sections'));
    const main = h('div', 'r-doc');
    doc.secs.forEach(function (x) {
      const n = x.rows.filter(function (r) { return r.kind === 'req' && (S.by === 'all' || r.d.by === S.by); }).length;
      rail.appendChild(railLink('rules-s' + x.no, x.title, n, x.no));
      main.appendChild(renderSec(x));
    });
    if (doc.pairs.length || doc.drift.length) {
      rail.appendChild(railLink('rules-tone', t('rules.tone')));
      main.appendChild(renderTone(doc));
    }
    rail.appendChild(railLink('rules-glossary', t('rules.glossary')));
    main.appendChild(renderGlossary());
    rail.appendChild(railLink('rules-briefs', t('rules.briefs')));
    main.appendChild(renderBriefs());
    layout.appendChild(rail);
    layout.appendChild(main);
    wrap.appendChild(layout);
    return wrap;
  }
  function render() {
    tabs.forEach(function (b) {
      const on = b.dataset.lang === S.lang;
      b.setAttribute('aria-selected', on ? 'true' : 'false');
      b.tabIndex = on ? 0 : -1;
    });
    panel.setAttribute('aria-labelledby', 'rulesTab-' + S.lang);
    panel.dataset.lang = S.lang;
    panel.textContent = '';
    panel.appendChild(renderLang());
  }

  // ── the language tabs ────────────────────────────────────────────────────────────
  // "Back to the desk" opens the desk on the language shown here (CEL-069, shell-spec §4).
  function deskLink() {
    const a = document.getElementById('rules-desk');
    if (a) a.setAttribute('href', '/admin/localization/document/?lang=' + encodeURIComponent(S.lang));
  }
  function choose(code, focus) {
    if (!known(code)) return;
    const b = tabs.find(function (x) { return x.dataset.lang === code; });
    if (code !== S.lang) {
      S.lang = code;
      S.by = 'all';
      const u = new URL(location.href);
      u.searchParams.set('lang', code);
      history.replaceState(null, '', u);
      deskLink();
      load();
    }
    if (focus && b) b.focus();
  }
  // Alt+1..8 picks the language (shell-spec §5): Alt alone (AltGr = Ctrl+Alt types), the digit's code (on a Mac
  // `key` is the character), no IME composition, focus outside a text box. Otherwise the key is left alone.
  document.addEventListener('keydown', function (e) {
    if (!e.altKey || e.ctrlKey || e.metaKey || e.isComposing) return;
    const at = document.activeElement;
    if (at && (/^(INPUT|TEXTAREA|SELECT)$/.test(at.tagName) || (at.closest && at.closest('[contenteditable]:not([contenteditable="false"])')))) return;
    const m = /^Digit([1-8])$/.exec(e.code || '');
    if (!m || !LOCALES[Number(m[1]) - 1]) return;
    e.preventDefault();
    choose(LOCALES[Number(m[1]) - 1].code, false);
  });
  tabs.forEach(function (b, i) {
    b.addEventListener('click', function () { choose(b.dataset.lang, false); });
    b.addEventListener('keydown', function (e) {
      let to = null;
      if (e.key === 'ArrowRight') to = tabs[(i + 1) % tabs.length];
      else if (e.key === 'ArrowLeft') to = tabs[(i - 1 + tabs.length) % tabs.length];
      else if (e.key === 'Home') to = tabs[0];
      else if (e.key === 'End') to = tabs[tabs.length - 1];
      if (!to) return;
      e.preventDefault();
      choose(to.dataset.lang, true);
    });
  });

  deskLink();
  load();
})();
</script>
</body>
